<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A2330" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zihin Molası">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zihin Molası</title>
<style>
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin-wght-normal.woff2) format("woff2");font-weight:300 700;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin-ext-wght-normal.woff2) format("woff2");font-weight:300 700;font-display:swap;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#FFF6EE;--card:#FFFFFF;--ink:#4A3A46;--soft:#8E7F8A;--line:#F5E6DA;
  --coral:#FF7E6B;--coral-d:#E2604F;--teal:#3DBFA0;--mustard:#F5B841;--plum:#9B7EDE;
  --ok:#3DB46D;--bad:#F0616B;--tea:#D9532B;
  --blob1:#FFE1D4;--blob2:#EAE1FF;
  --shadow:0 2px 0 rgba(74,58,70,.04),0 10px 26px rgba(255,126,107,.12);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#2A2330;--card:#3A3142;--ink:#FFF3EA;--soft:#BBAFC0;--line:#4D4257;--blob1:#3B2A33;--blob2:#322C45;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-weight:450;
  font-family:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none;
  background:radial-gradient(60% 34% at 0% 0%,var(--blob1) 0,transparent 100%),radial-gradient(55% 30% at 100% 12%,var(--blob2) 0,transparent 100%),var(--bg);
  background-repeat:no-repeat}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
h1,h2,h3,p{margin:0}
b,h1,h2,h3{font-weight:650}
.card{background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--shadow);border:2px solid var(--line)}
.btn{display:block;width:100%;padding:17px;border-radius:22px;background:var(--coral);color:#fff;font-weight:650;
  font-size:19px;letter-spacing:.01em;box-shadow:0 5px 0 var(--coral-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.btn:disabled{opacity:.7}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.link{display:block;margin:12px auto 0;color:var(--soft);font-size:15px;padding:8px 12px;font-weight:500}

/* Demli (maskot) */
.demli{display:block;overflow:visible}
.demli .govde{transform-origin:60px 128px;animation:salla 3.2s ease-in-out infinite}
.demli .buhar{animation:buhar 2.6s ease-in-out infinite}
.demli .buhar.b2{animation-delay:.9s}
@keyframes salla{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes buhar{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
.hero{display:flex;align-items:flex-end;gap:6px;margin-bottom:14px}
.hero .demli{flex:none;width:104px;height:122px;margin-left:-6px}
.balon{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:18px;
  box-shadow:var(--shadow)}
.balon:before{content:"";position:absolute;left:-9px;bottom:16px;width:16px;height:16px;background:var(--card);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 5px}
.balon b{display:block;font-size:21px;line-height:1.15}
.balon span{display:block;color:var(--soft);font-size:15px;line-height:1.35;margin-top:4px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:14px;background:var(--card);border:2px solid var(--line);
  font-size:18px;display:grid;place-items:center}
.topbar{display:flex;align-items:center;margin-bottom:6px}
.topbar .brand{font-size:14px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--coral);margin-right:auto}

/* haftalık çay kartı */
.hafta{margin-bottom:14px;padding:14px 16px}
.hafta .ust{display:flex;align-items:center;gap:8px;font-size:15px}
.hafta .ust b{font-size:16px}
.hafta .seri{margin-left:auto;background:#FFF0D6;color:#B46A00;border-radius:999px;padding:4px 10px;font-weight:650;font-size:14px;white-space:nowrap}
@media (prefers-color-scheme:dark){.hafta .seri{background:#4A3A2A;color:#FFCF8A}}
.caylar{display:flex;justify-content:space-between;gap:6px;margin:12px 4px 4px}
.cay{flex:1;max-width:52px}
.cay svg{display:block;width:100%;height:auto}
.cay.bos{opacity:.9}
.cay.yeni svg{animation:pop .5s ease-out}
.hafta small{display:block;color:var(--soft);font-size:13px;margin-top:6px;text-align:center}

/* günün molası */
.daily{margin-bottom:22px;background:linear-gradient(140deg,#FFEDE3,#FFDFE6);border-color:#FFD2C7}
@media (prefers-color-scheme:dark){.daily{background:linear-gradient(140deg,#43303A,#4A3340);border-color:#5A4250}}
.daily h2{font-size:22px}
.daily p{color:var(--soft);margin:4px 0 12px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card);
  border:2px solid var(--line);font-size:14px;font-weight:550}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.done{opacity:.55;text-decoration:line-through}
.mini{display:block;width:100%;text-align:center;margin-top:12px;color:var(--soft);font-size:15px;font-weight:500;padding:6px}
.mini u{text-decoration:none;border-bottom:2px dotted currentColor}
.sec{font-size:15px;color:var(--soft);font-weight:650;margin:0 6px 10px;letter-spacing:.02em}

/* oyun karoları */
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile-g{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 8px 12px;width:100%;position:relative}
.tile-g:active,.saray-card:active{transform:scale(.97)}
.tile-g,.saray-card{transition:transform .1s}
.gico{flex:none;width:58px;height:58px;border-radius:22px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.10)}
.gico svg{width:30px;height:30px}
.tile-g b{font-size:16px;line-height:1.15}
.tile-g small{color:var(--soft);font-size:13px}
.rozet{font-size:12px;font-weight:650;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--soft);margin-top:2px}
.rozet.yeni{background:#E4F7EF;color:#1F8C6A}
@media (prefers-color-scheme:dark){.rozet.yeni{background:#274A40;color:#9BE5CB}}
.ginfo{flex:1;min-width:0}
.ginfo b{display:block;font-size:17px}
.ginfo small{color:var(--soft);font-size:13px}
.gbest{text-align:right;font-size:12px;color:var(--soft)}
.gbest b{display:block;font-size:18px;color:var(--ink)}
.spark{display:block;margin:2px auto 0}
.install{margin-bottom:14px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.35}
.install .x{margin-left:auto;color:var(--soft);font-size:18px;padding:6px}
.install .btn{width:auto;padding:10px 14px;font-size:15px}
.foot{color:var(--soft);font-size:12px;text-align:center;margin-top:24px;line-height:1.5}

/* tanışma */
.onb{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.onb .demli{width:150px;height:176px;margin:0 auto}
.onb h2{font-size:28px;line-height:1.15}
.onb p{color:var(--soft);font-size:17px;line-height:1.5;max-width:340px;margin:0 auto}
.onb p b{color:var(--ink)}
.noktalar{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.noktalar i.on{background:var(--coral);width:22px;border-radius:99px}
.slotlar{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.msaat{padding:14px 6px;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:600;font-size:16px}
.msaat span{display:block;font-size:26px;margin-bottom:2px}
.msaat small{display:block;color:var(--soft);font-weight:450;font-size:12px}
.msaat.sel{border-color:var(--coral);box-shadow:0 4px 0 var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--card))}

/* konfeti */
.konfeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.konfeti i{position:absolute;top:-24px;font-style:normal;font-size:22px;animation:dus 1.9s ease-in forwards}
@keyframes dus{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

/* oyun ekranı */
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gtop .close{width:40px;height:40px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:17px}
.gtop .gt{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gtop .gs{white-space:nowrap;flex:none}
.gtop .gs{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
.tbar i{display:block;height:100%;width:100%;background:var(--teal);border-radius:99px;transform-origin:left;transition:transform .1s linear}
.tbar.hide{visibility:hidden}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px 0 20px;user-select:none;-webkit-user-select:none}

/* nasıl oynanır */
.howto{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.howto .gico{width:84px;height:84px;border-radius:26px;margin:0 auto}
.howto .gico svg{width:46px;height:46px}
.howto h2{font-size:28px}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.howto p{color:var(--soft);font-size:17px;line-height:1.5;max-width:360px;margin:0 auto}
.howto p b{color:var(--ink)}
.progress{font-size:14px;color:var(--soft);font-weight:600}
.count{position:fixed;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:var(--coral);
  background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:10;animation:pop .55s ease-out}
@keyframes pop{from{transform:scale(1.12)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Sıra Hafızası */
.msg{text-align:center;font-size:22px;font-weight:700;min-height:30px;color:var(--soft)}
.msg.go{color:var(--teal)}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px;margin:0 auto}
.tile{aspect-ratio:1;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);
  transition:background .12s,transform .12s}
.tile.on{background:var(--coral);border-color:var(--coral);transform:scale(.95)}
.tile.bad{background:var(--bad);border-color:var(--bad)}
.tile.hint{border-color:var(--teal);border-width:4px}

/* Renk Tuzağı */
.rule{align-self:center;padding:8px 16px;border-radius:999px;color:#fff;font-weight:750;font-size:17px;background:var(--plum)}
.rule.anlam{background:var(--teal)}
.rule.flip{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.word{text-align:center;font-size:54px;font-weight:850;letter-spacing:.02em;min-height:72px}
.word.pop{animation:pop .2s ease-out}
.choices4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{padding:22px 8px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);
  font-size:19px;font-weight:750}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.fb{text-align:center;font-weight:700;min-height:24px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}

/* Hızlı Hesap */
.q{text-align:center;font-size:56px;font-weight:850;font-variant-numeric:tabular-nums;min-height:76px}
.q.pop{animation:pop .18s ease-out}
.lvl{text-align:center;color:var(--soft);font-weight:600}

/* Eşini Bul */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px;margin:0 auto}
.c3{aspect-ratio:3/4;position:relative;transform-style:preserve-3d;transition:transform .32s;border-radius:14px}
.c3.open,.c3.done{transform:rotateY(180deg)}
.c3 .f,.c3 .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center}
.c3 .b{background:var(--mustard);background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.5px);
  background-size:12px 12px;box-shadow:0 3px 0 #D69A22}
.c3 .f{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);font-size:34px}
.c3.done .f{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}

/* İki Önce */
.nb-card{width:200px;height:200px;margin:0 auto;border-radius:32px;background:var(--card);border:2px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center}
.nb-card.pop{animation:pop .18s ease-out}
.nb-sym{font-size:110px;line-height:1;color:#5B9BF0}
.nb-btn{background:#5B9BF0;box-shadow:0 4px 0 #3F7ACB;padding:22px}
.nb-btn.ok{background:var(--ok);box-shadow:0 4px 0 #1F7442}
.nb-btn.bad{background:var(--bad);box-shadow:0 4px 0 #A83232}

/* Göz Ucu */
.goz{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:28px;background:var(--card);border:2px solid var(--line)}
.goz .slot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;display:grid;place-items:center;font-size:36px;line-height:1;border-radius:50%}
.goz .mid{left:50%;top:50%;font-size:46px;width:64px;height:64px;margin:-32px 0 0 -32px;color:var(--soft)}
.goz.mask .slot{background:repeating-linear-gradient(45deg,var(--soft) 0 3px,transparent 3px 7px);opacity:.6}
.goz.ask .per{border:3px dashed var(--line);cursor:pointer}
.goz.ask .per:active{background:var(--line)}
.goz .per.right{border:3px solid var(--ok)}
.goz .per.wrong{border:3px solid var(--bad)}
.goz-ans{min-height:150px}

/* Günün Kelimeleri */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.wgrid.pick{grid-template-columns:1fr 1fr 1fr;gap:8px}
.wcard{padding:16px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:19px;font-weight:750;
  box-shadow:0 3px 0 var(--line)}
.pick .wcard{padding:14px 4px;font-size:15px}
.wcard.sel{background:#7DB85A;border-color:#7DB85A;color:#fff}
.wcard.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.wcard.fa{background:var(--bad);border-color:var(--bad);color:#fff;text-decoration:line-through}
.wcard.miss{border-color:var(--mustard);border-style:dashed;color:var(--mustard)}
.wcard.dim{opacity:.4}

/* Hafıza Sarayı */
.sp-place{text-align:center;font-size:26px;font-weight:800}
.sp-arrow{text-align:center;font-size:26px;color:var(--soft)}
.sp-word{align-self:center;padding:22px 34px;border-radius:24px;background:#C98A5E;color:#fff;font-size:34px;font-weight:850;
  box-shadow:0 5px 0 #A66D45}
.sp-hint{text-align:center;color:var(--soft);font-size:16px;line-height:1.45}
.choice.c-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.c-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bilim{font-size:14px!important;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.saray-card{display:flex;align-items:center;gap:14px;margin-bottom:22px;text-align:left;width:100%}

/* Bilim sayfası */
.bilimlist{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.bilimlist b{font-size:17px}
.bilimlist p{color:var(--soft);font-size:15px;line-height:1.45;margin:6px 0 8px}
.bilimlist a{color:var(--teal);font-size:13px;font-weight:600;text-decoration:none}

.ozet-demli .demli{width:120px;height:140px;margin:0 auto}
.yildiz{align-self:center;background:#FFF0D6;color:#8A5A00;border-radius:999px;padding:6px 14px;font-size:15px}
@media (prefers-color-scheme:dark){.yildiz{background:#4A3A2A;color:#FFCF8A}}
.install{margin-bottom:22px!important}

/* bölümler */
.gridN{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:calc(36px / var(--n,3));width:100%;max-width:340px;margin:0 auto}
.gridN .tile{border-radius:calc(60px / var(--n,3));box-shadow:0 3px 0 var(--line)}
.mem{grid-template-columns:repeat(var(--c,4),1fr)!important}
.mem.sik{gap:6px}
.mem .c3{aspect-ratio:var(--ar,3/4)}
.mem .c3 .f{font-size:var(--fs,34px)}
.choices4.uc{grid-template-columns:repeat(3,1fr);gap:8px}
.choices4.uc .choice{font-size:15px;padding:20px 2px}
.goz.p12 .slot.per{width:42px;height:42px;margin:-21px 0 0 -21px;font-size:28px}
.bno{color:var(--soft);font-weight:450;font-size:13px;margin-left:6px}
.sumlist .bno{display:block;margin-left:0}
.yildizlar{display:inline-flex;gap:1px;font-size:11px;line-height:1;vertical-align:middle}
.yildizlar i{font-style:normal;color:var(--line)}
.yildizlar i.on{color:#F5B841}
.yildizlar.orta{font-size:20px;gap:2px}
.yildizlar.buyuk{font-size:68px;gap:6px;justify-content:center}
.yildizlar.buyuk i.on{animation:pop .45s ease-out backwards}
.yildizlar.buyuk i:nth-child(2){animation-delay:.18s}
.yildizlar.buyuk i:nth-child(3){animation-delay:.36s}
.devam{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.devam .btn{width:auto;padding:12px 20px;font-size:17px}
.kat{font-size:15px;margin:20px 4px 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kat small{color:var(--soft);font-weight:450;font-size:12px}
.bolumler{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bl{aspect-ratio:1;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bl b{font-size:18px;line-height:1}
.bl:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.bl.simdi{border-color:var(--coral);box-shadow:0 3px 0 var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--card))}
.bl.kilit{opacity:.5;box-shadow:none}
.bl.kilit b{font-size:13px}
.bl.kilit small{font-size:11px;color:var(--soft)}
.bolum-kart{display:flex;flex-direction:column;gap:4px;align-items:center;padding:14px;max-width:360px;margin:0 auto;width:100%}
.bolum-kart b{font-size:20px}

<body>
<div id="app"></div>
<script src="mantik.js"></script>
<script src="kelimeler.js"></script>
<script>
'use strict';
/* ---------- yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const { dayKey, dayNum } = ZM;

/* ---------- kayıt (telefonun içinde) ---------- */
const KEY = 'zihinmolasi.v1';
let S;
try { S = ZM.loadState(JSON.parse(localStorage.getItem(KEY))); } catch (e) { S = ZM.loadState(null); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const histOf = id => S.hist.filter(h => h.g === id);
const playedDays = () => new Set(S.hist.map(h => h.d));
const streakInfo = () => ZM.streak(playedDays(), new Date());
const streak = () => streakInfo().n;

/* ---------- ses ve titreşim ---------- */
let actx;
function beep(f = 520, d = .08, type = 'sine', vol = .07) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- süre sayacı (uygulama arka plana gidince durur) ---------- */
function makeTimer(total, onTick, onEnd) {
  let left = total, last = performance.now(), dead = false;
  const vis = () => { last = performance.now(); };
  document.addEventListener('visibilitychange', vis);
  const iv = setInterval(() => {
    const now = performance.now();
    if (!document.hidden) left -= now - last;
    last = now;
    if (left <= 0) { stop(); onTick(0); onEnd(); return; }
    onTick(left);
  }, 100);
  function stop() { if (dead) return; dead = true; clearInterval(iv); document.removeEventListener('visibilitychange', vis); }
  onTick(left);
  return { stop };
}

/* ---------- simgeler ---------- */
const ICON = {
  sira: '<svg viewBox="0 0 24 24" fill="currentColor">' + [0,1,2,3,4,5,6,7,8].map(i =>
    `<rect x="${2 + (i % 3) * 7}" y="${2 + Math.floor(i / 3) * 7}" width="6" height="6" rx="1.6" opacity="${[0,4,8,5].includes(i) ? 1 : .35}"/>`).join('') + '</svg>',
  renk: '<svg viewBox="0 0 24 24"><text x="12" y="17.5" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor" font-family="system-ui,sans-serif">Aa</text></svg>',
  es: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="9" height="13" rx="2" transform="rotate(-8 7.5 11.5)"/><rect x="12" y="5" width="9" height="13" rx="2" opacity=".55" transform="rotate(8 16.5 11.5)"/></svg>',
  iki: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6 5 12l6 6M19 6l-6 6 6 6"/></svg>',
  goz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  kelime: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></svg>',
  saray: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 7v2h18V7z"/><rect x="5" y="10" width="2.4" height="8" rx=".6"/><rect x="10.8" y="10" width="2.4" height="8" rx=".6"/><rect x="16.6" y="10" width="2.4" height="8" rx=".6"/><rect x="3" y="19" width="18" height="2.4" rx=".6"/></svg>',
  sudoku: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>',
  kelime: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/><path d="M7.8 13.4l2.7-6.4 2.7 6.4M8.7 11.4h3.6" stroke-width="1.8"/></svg>',
  buyuk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.6" fill="currentColor"/><path d="M3.5 17l5-5 3.5 3.5 3-3 5.5 5"/></svg>',
  yapboz: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4.2a2 2 0 1 1 4 0V6h4a1 1 0 0 1 1 1v3.5h-1.3a2 2 0 1 0 0 4H19V19a1 1 0 0 1-1 1h-4v-1.5a2 2 0 1 0-4 0V20H6a1 1 0 0 1-1-1v-4.5h1.3a2 2 0 1 0 0-4H5V7a1 1 0 0 1 1-1h4z"/></svg>',
  hesap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 3.5v7M3.5 7h7M14 7h6.5M15 15l5 5M20 15l-5 5M3.5 17.5h7"/></svg>',
};

/* ---------- oyunlar ---------- */
const PRAISE = ['Harika!', 'Süper!', 'Tam isabet!', 'Beyin ısındı!', 'Aferin!', 'Çok iyi!'];
const yildizHTML = (n, cls = '') => `<span class="yildizlar ${cls}" aria-label="${n} yıldız">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}">★</i>`).join('')}</span>`;
const yuzde = a => '%' + Math.round(a * 100);

/* Her oyun bir bölümün ayarlarını (P) ZM.levelParams'tan alır; sonucu ham haliyle api.end'e verir, yıldızı ZM.rate hesaplar. */
const GAMES = {
  sira: {
    name: 'Sıra Hafızası', skill: 'Hafıza', color: '#FF7E6B', timed: false,
    howto: 'Kareler sırayla yanacak. <b>İzle</b>, sonra <b>aynı sırayla</b> dokun. Bölümdeki bütün turları bitir.',
    bilim: 'Araştırmacıların kısa süreli görsel belleği ölçmek için kullandığı “Corsi blokları” görevinin bir türüdür.',
    ozet: P => `${P.len} karelik sıra · ${P.rounds} tur${P.grid > 3 ? ` · ${P.grid}×${P.grid} tahta` : ''}`,
    hedef: P => `En fazla ${P.maxMistakes} hata. Hatasız bitirirsen 3 yıldız.`,
    start(stage, api, P) {
      let alive = true, done = 0, mistakes = 0, seq = [], idx = 0, accept = false;
      const T = P.grid * P.grid, can = P.maxMistakes + 1;
      stage.innerHTML = `<div class="msg">İzle…</div><div class="gridN" style="--n:${P.grid}">` +
        Array.from({ length: T }, (_, i) => `<button class="tile" data-i="${i}" aria-label="Kare ${i + 1}"></button>`).join('') + '</div>';
      const tiles = [...stage.querySelectorAll('.tile')], m = $('.msg', stage);
      const stat = () => api.stat(`Tur ${Math.min(done + 1, P.rounds)}/${P.rounds} · ${'♥'.repeat(Math.max(0, can - mistakes))}${'♡'.repeat(Math.min(can, mistakes))}`);
      const say = (t, c = '') => { m.textContent = t; m.className = 'msg ' + c; };
      const ses = i => 330 + (i % 9) * 55;
      async function light(i, ms, cls = 'on') { tiles[i].classList.add(cls); await sleep(ms); tiles[i].classList.remove(cls); }
      async function round() {
        if (!alive) return;
        accept = false; idx = 0; seq = [];
        for (let k = 0; k < P.len; k++) { let t; do t = rnd(T); while (k && t === seq[k - 1]); seq.push(t); }
        stat(); say('İzle…'); await sleep(700);
        for (const i of seq) { if (!alive) return; beep(ses(i), P.onMs / 1000 * .8); await light(i, P.onMs); await sleep(160); }
        if (!alive) return;
        say('Sıra sende', 'go'); accept = true;
      }
      stage.querySelector('.gridN').addEventListener('pointerdown', async e => {
        const b = e.target.closest('.tile'); if (!b || !accept) return;
        const i = +b.dataset.i;
        if (i === seq[idx]) {
          idx++; beep(ses(i), .08); light(i, 170);
          if (idx < seq.length) return;
          accept = false; done++; say(pick(PRAISE), 'ok'); beep(880, .12);
          await sleep(750); if (!alive) return;
          if (done >= P.rounds) { alive = false; api.end({ done: true, mistakes }, `${P.len} karelik ${P.rounds} sırayı ${mistakes ? mistakes + ' hatayla' : 'hatasız'} tamamladın.`); }
          else round();
        } else {
          accept = false; mistakes++; stat(); buzz(120); beep(150, .25, 'square');
          light(i, 450, 'bad'); tiles[seq[idx]].classList.add('hint');
          await sleep(900); if (!alive) return;
          tiles[seq[idx]].classList.remove('hint');
          if (mistakes > P.maxMistakes) { alive = false; api.end({ done: false, mistakes }, `${done}/${P.rounds} tur tamamlandı.`); return; }
          say('Olsun, yeni sıra geliyor', 'bad'); await sleep(800); round();
        }
      });
      round();
      return () => { alive = false; };
    }
  },

  renk: {
    name: 'Renk Tuzağı', skill: 'Dikkat', color: '#9B7EDE', timed: true,
    howto: 'Bir renk adı çıkacak ama çoğu zaman <b>başka renkle</b> yazılmış olacak. Üstteki kural ne diyorsa ona dokun: yazının <b>RENGİ</b> mi, <b>ANLAMI</b> mı?',
    bilim: 'Stroop etkisi: beyin yazıyı otomatik okur; rengi söylemek için bu alışkanlığı bastırman gerekir. Kural değişimi zihinsel esnekliği de zorlar.',
    ozet: P => `${P.items} kelime · ${P.colors} renk${P.switchP ? ' · kural değişir' : ''} · ${P.time} sn`,
    hedef: P => `Süre bitmeden, en fazla ${P.maxWrong} yanlış. Hatasız 3 yıldız.`,
    start(stage, api, P) {
      const C = [{ n: 'KIRMIZI', c: '#E5484D' }, { n: 'MAVİ', c: '#3B82F6' }, { n: 'YEŞİL', c: '#22A05A' }, { n: 'MOR', c: '#9B59D0' },
        { n: 'TURUNCU', c: '#F08A24' }, { n: 'GRİ', c: '#8A8F98' }].slice(0, P.colors);
      const N = C.length;
      let i = 0, wrong = 0, trial = 0, rule = 'renk', cur, bitti = false;
      stage.innerHTML = `<div class="rule"></div><div class="word"></div><div class="choices4 ${N > 4 ? 'uc' : ''}">` +
        C.map((x, k) => `<button class="choice" data-i="${k}">${x.n}</button>`).join('') + '</div><div class="fb"></div>';
      const R = $('.rule', stage), W = $('.word', stage), F = $('.fb', stage);
      const stat = () => api.stat(`${i}/${P.items}`);
      function next() {
        trial++;
        const flip = P.switchP > 0 && trial > 3 && Math.random() < P.switchP;
        if (flip) rule = rule === 'renk' ? 'anlam' : 'renk';
        const w = rnd(N); let ink = rnd(N);
        if (Math.random() < .78) while (ink === w) ink = rnd(N);
        cur = { w, ink };
        R.textContent = rule === 'renk' ? 'Yazının RENGİNE dokun' : 'Yazının ANLAMINA dokun';
        R.className = 'rule ' + rule + (flip ? ' flip' : '');
        W.textContent = C[w].n; W.style.color = C[ink].c;
        W.classList.remove('pop'); void W.offsetWidth; W.classList.add('pop');
      }
      const t = makeTimer(P.time * 1000, l => api.time(l / (P.time * 1000)), () => {
        if (bitti) return; bitti = true; api.end({ done: false, wrong }, `Süre bitti: ${i}/${P.items} kelime.`);
      });
      stage.querySelector('.choices4').addEventListener('pointerdown', e => {
        const b = e.target.closest('.choice'); if (!b || bitti) return;
        const ans = rule === 'renk' ? cur.ink : cur.w;
        if (+b.dataset.i === ans) { beep(700, .06); F.textContent = '✓'; F.className = 'fb ok'; }
        else { wrong++; buzz(80); beep(160, .18, 'square'); F.textContent = rule === 'renk' ? 'Rengine bak!' : 'Anlamına bak!'; F.className = 'fb bad'; }
        i++; stat();
        if (i >= P.items) { bitti = true; t.stop(); api.end({ done: true, wrong }, `${P.items} kelimede ${wrong} yanlış.`); }
        else next();
      });
      stat(); next();
      return () => { bitti = true; t.stop(); };
    }
  },

  es: {
    name: 'Eşini Bul', skill: 'Görsel hafıza', color: '#F5B841', timed: false,
    howto: 'Kartları ikişer ikişer aç ve eşlerini bul. Gördüğün kartların yerini aklında tut; hamle hakkın bitmeden hepsini eşleştir.',
    bilim: 'Nesnelerin yerini aklında tutmak, görsel-mekânsal hafızayı çalıştırır.',
    ozet: P => `${P.pairs * 2} kart · ${P.maxMoves} hamle hakkı`,
    hedef: P => `${Math.ceil(P.pairs * 1.7)} hamlede bitirirsen 3 yıldız.`,
    start(stage, api, P) {
      const SYM = ['🍎', '🐟', '🌙', '⭐', '🌵', '🎈', '🍋', '🦋', '🍄', '🐢', '🌻', '☂️', '🍉', '🚲', '🎸', '🐧', '🍩', '🔑', '🐝', '🍓', '🚀', '🐘'];
      const sym = shuffle(SYM.slice()).slice(0, P.pairs), deck = shuffle([...sym, ...sym]), cols = ZM.esCols(deck.length);
      let open = [], moves = 0, found = 0, lock = false, alive = true;
      const t0 = performance.now();
      stage.innerHTML = `<div class="mem ${cols > 4 ? 'sik' : ''}" style="--c:${cols};--fs:${cols <= 4 ? 34 : cols === 5 ? 28 : 23}px;--ar:${cols <= 4 ? '3/4' : '4/5'}">` + deck.map((s, i) =>
        `<button class="c3" data-i="${i}" aria-label="Kart"><span class="b"></span><span class="f">${s}</span></button>`).join('') + '</div>';
      const stat = () => api.stat(`${moves}/${P.maxMoves} hamle`);
      stage.querySelector('.mem').addEventListener('click', async e => {
        const c = e.target.closest('.c3'); if (!c || lock || !alive || c.classList.contains('open') || c.classList.contains('done')) return;
        c.classList.add('open'); beep(500, .05); open.push(c);
        if (open.length < 2) return;
        moves++; stat(); lock = true;
        const [a, b] = open; open = [];
        if (deck[a.dataset.i] === deck[b.dataset.i]) {

        } else {
          await sleep(750); a.classList.remove('open'); b.classList.remove('open');

  goz: {

      const pos = Array.from({ length: NP }, (_, k) => {

const ORDER = ['sira', 'renk', 'es', 'hesap', 'iki', 'goz'];
const BULMACA = ['sudoku', 'kelime', 'yapboz', 'buyuk'];

// İki yapbozun ortak oyun motoru. dolu = true ise tahta ekranı doldurur.
function yapbozOyunu(stage, api, P, resimURL, dolu) {
  const N = P.cols * P.rows, arr = ZM.yapbozKaristir(N), resim = `url(${resimURL})`; // arr[konum] = parça numarası
  let sel = -1, surukle = -1, moves = 0, alive = true;
  const kare = Math.max(22, Math.floor(Math.min(Math.min(innerWidth - 32, dolu ? 448 : 340) / P.cols, (innerHeight - (dolu ? 210 : 330)) / P.rows)));
  stage.innerHTML = `<div class="yb-ust"><button class="yb-kucuk" style="aspect-ratio:${P.cols}/${P.rows}" aria-label="Resmi büyüt"></button><span>Resimdeki gibi olana kadar parçaların yerini değiştir. Resme dokunursan büyür.</span></div>
    <div class="yb ${dolu ? 'dolu' : ''}" style="--c:${P.cols};width:${kare * P.cols}px">${arr.map((_, k) => `<button class="yp" data-k="${k}" aria-label="Parça ${k + 1}"></button>`).join('')}</div>`;
  if (dolu) stage.classList.add('sikisik');
  const KR = $('.yb-kucuk', stage);
  KR.style.backgroundImage = resim;
  KR.addEventListener('click', () => KR.classList.toggle('buyuk'));
  const Y = [...stage.querySelectorAll('.yp')], T = $('.yb', stage);
  const boya = k => {
    const id = arr[k], s = Y[k].style;
    Y[k].dataset.p = id; Y[k].classList.toggle('yerinde', id === k);
    s.backgroundImage = resim; s.backgroundSize = `${P.cols * 100}% ${P.rows * 100}%`;
    s.backgroundPosition = `${P.cols > 1 ? (id % P.cols) / (P.cols - 1) * 100 : 0}% ${P.rows > 1 ? Math.floor(id / P.cols) / (P.rows - 1) * 100 : 0}%`;
  };
  const yerinde = () => arr.filter((v, i) => v === i).length;
  const stat = () => api.stat(`✓ ${yerinde()}/${N} · ${moves}/${P.maxMoves}`);
  const isaret = k => { sel = k; Y.forEach((y, i) => y.classList.toggle('secili', i === k)); };
  const hedef = k => Y.forEach((y, i) => y.classList.toggle('hedef', i === k));
  const alttaki = e => { const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest ? el.closest('.yp') : null; return b && T.contains(b) ? +b.dataset.k : -1; };
  async function degistir(a, b) {
    if (a === b || arr[a] === a || arr[b] === b) return; // yerine oturan parça kilitli
    [arr[a], arr[b]] = [arr[b], arr[a]]; boya(a); boya(b);
    moves++; stat(); beep(arr[a] === a || arr[b] === b ? 760 : 520, .05);
    const y = yerinde();
    if (y === N) { alive = false; T.classList.add('tamam'); beep(880, .14); await sleep(900); api.end({ done: true, moves }, `${N} parçayı ${moves} hamlede tamamladın.`); }
    else if (moves >= P.maxMoves) { alive = false; await sleep(300); api.end({ done: false, moves }, `Hamle hakkı bitti: ${y}/${N} parça yerindeydi.`); }
  }
  T.addEventListener('pointerdown', e => {
    const b = e.target.closest('.yp'); if (!b || !alive) return;
    const k = +b.dataset.k;
    if (arr[k] === k) return;
    if (sel === k) { isaret(-1); surukle = -1; return; }
    if (sel >= 0) { const a = sel; isaret(-1); surukle = -1; degistir(a, k); }
    else { isaret(k); surukle = k; }
  });
  T.addEventListener('pointermove', e => { if (surukle >= 0 && alive) { const k = alttaki(e); hedef(k >= 0 && k !== surukle && arr[k] !== k ? k : -1); } });
  const birak = e => {
    if (surukle < 0) return;
    const a = surukle, k = alttaki(e); surukle = -1; hedef(-1);
    if (alive && k >= 0 && k !== a) { isaret(-1); degistir(a, k); }
  };
  T.addEventListener('pointerup', birak);
  T.addEventListener('pointercancel', () => { surukle = -1; hedef(-1); });
  Y.forEach((_, k) => boya(k)); stat();
  return () => { alive = false; };
}

// Büyük Yapboz resimleri: tuvale çizilen sevimli sahneler. tur: 0 çayırda kediler, 1 dağ gölü, 2 gün batımı, 3 gece
function buyukResim(cols, rows, tohum, tur) {
  const r = ZM.rng(tohum), B = 90, W = cols * B, H = rows * B, u = Math.min(W, H) / 10;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const R = (a, b) => a + r() * (b - a), sec = a => a[Math.floor(r() * a.length)];
  const daire = (cx, cy, rad, renk) => { x.fillStyle = renk; x.beginPath(); x.arc(cx, cy, rad, 0, 7); x.fill(); };
  const elips = (cx, cy, rx, ry, renk) => { x.fillStyle = renk; x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, 7); x.fill(); };

  const tepe = (y, amp, renk) => {

  const kus = (cx, cy, s, renk) => { x.strokeStyle = renk; x.lineWidth = s * .16; x.lineCap = 'round'; x.beginPath(); x.moveTo(cx - s, cy); x.quadraticCurveTo(cx - s * .5, cy - s * .7, cx, cy); x.quadraticCurveTo(cx + s * .5, cy - s * .7, cx + s, cy); x.stroke(); };
  const kedi = (cx, cy, s, renk, gozRenk = '#3A2A2A') => { // oturan sevimli kedi; (cx, cy) kafanın merkezi
    x.strokeStyle = renk; x.lineWidth = s * .3; x.lineCap = 'round'; x.beginPath(); x.moveTo(cx + s * .7, cy + s * 1.6); x.quadraticCurveTo(cx + s * 1.8, cy + s * 1.5, cx + s * 1.5, cy + s * .5); x.stroke();
    elips(cx, cy + s * 1.0, s * .9, s * 1.0, renk);
    for (const d of [-1, 1]) {
      x.fillStyle = renk; x.beginPath(); x.moveTo(cx + d * s * .9, cy - s * .3); x.lineTo(cx + d * s * .78, cy - s * 1.3); x.lineTo(cx + d * s * .15, cy - s * .8); x.fill();
      x.fillStyle = '#FFB3C1'; x.beginPath(); x.moveTo(cx + d * s * .74, cy - s * .5); x.lineTo(cx + d * s * .7, cy - s * 1.02); x.lineTo(cx + d * s * .38, cy - s * .76); x.fill();
    }
    daire(cx, cy, s, renk);
    elips(cx, cy + s * 1.2, s * .45, s * .6, 'rgba(255,255,255,.7)');
    for (const d of [-1, 1]) { daire(cx + d * s * .42, cy - s * .05, s * .2, gozRenk); daire(cx + d * s * .42 + s * .06, cy - s * .12, s * .07, '#fff'); daire(cx + d * s * .66, cy + s * .3, s * .17, 'rgba(255,130,155,.5)'); }
    x.fillStyle = '#FF8FA3'; x.beginPath(); x.moveTo(cx - s * .1, cy + s * .2); x.lineTo(cx + s * .1, cy + s * .2); x.lineTo(cx, cy + s * .33); x.fill();
    x.strokeStyle = '#3A2A2A'; x.lineWidth = s * .05; x.beginPath(); x.moveTo(cx, cy + s * .33); x.quadraticCurveTo(cx - s * .12, cy + s * .52, cx - s * .27, cy + s * .42); x.moveTo(cx, cy + s * .33); x.quadraticCurveTo(cx + s * .12, cy + s * .52, cx + s * .27, cy + s * .42); x.stroke();
    x.lineWidth = s * .035; for (const d of [-1, 1]) for (const e of [-.08, .1]) { x.beginPath(); x.moveTo(cx + d * s * .55, cy + s * (.3 + e)); x.lineTo(cx + d * s * 1.3, cy + s * (.24 + e * 2.4)); x.stroke(); }

    x.globalAlpha = .35; for (let i = 0; i < rows * 3; i++) { x.fillStyle = '#fff'; x.fillRect(R(0, W), R(ufuk + u * .3, H * .86), u * R(.6, 1.8), u * .07); } x.globalAlpha = 1;
    tepe(H * .86, u * .4, '#8FD694');
    for (let i = 0; i < cols + 2; i++) cam(R(0, W), H * R(.84, .93), u * R(.9, 1.5), sec(['#3F9E6B', '#2F8A5F', '#57B37A']));
    for (let i = 0; i < 4; i++) kus(R(0, W), R(H * .06, ufuk * .7), u * R(.25, .4), '#5B6B8A');
    kedi(W * R(.25, .75), H * .8, u * 1.15, sec(KEDI));
    x.fillStyle = '#C98A5E'; x.beginPath(); x.moveTo(W * .1, ufuk + u * 1.2); x.lineTo(W * .32, ufuk + u * 1.2); x.lineTo(W * .28, ufuk + u * 1.6); x.lineTo(W * .14, ufuk + u * 1.6); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.moveTo(W * .21, ufuk + u * 1.2); x.lineTo(W * .21, ufuk - u * .3); x.lineTo(W * .31, ufuk + u * 1.05); x.fill();
  } else if (tur === 2) { // gün batımında deniz

    gok(ufuk, H, '#7A6BC9', '#3F5FA8');
    x.globalAlpha = .5; for (let i = 0; i < rows * 4; i++) { x.fillStyle = sec(['#FFE9B8', '#FFB89A', '#C9C0FF']); x.fillRect(R(0, W), R(ufuk + u * .2, H), u * R(.5, 2), u * .08); } x.globalAlpha = 1;

    x.fillStyle = '#8A5A3C'; x.fillRect(0, H * .88, W, H * .12); x.fillStyle = '#6E452D'; for (let i = 0; i < cols * 2; i++) x.fillRect(i * W / (cols * 2), H * .88, 3, H * .12);

// Yapboz resmi: bölüm numarasına göre hep aynı çıkan renkli bir sahne (tuvale çizilir; her parçada ayırt edici bir şey olur)
function sahneResmi(cols, rows, tohum) {
  const r = ZM.rng(tohum), B = 110, W = cols * B, Hh = rows * B, sec = a => a[Math.floor(r() * a.length)];
  const cv = document.createElement('canvas'); cv.width = W; cv.height = Hh;
  const x = cv.getContext('2d');
  const [c1, c2] = sec([['#FFE2D6', '#FFC9DD'], ['#D9F0FF', '#E3DCFF'], ['#FFF1C2', '#FFD9BD'], ['#D8F5E6', '#CFE8FF'], ['#F1E0FF', '#FFDDEA']]);
  const gr = x.createLinearGradient(0, 0, W, Hh); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  x.fillStyle = gr; x.fillRect(0, 0, W, Hh);
  // resmi bütünleştiren büyük kuşaklar
  for (let i = 0; i < 4; i++) {
    x.beginPath(); x.strokeStyle = sec(['#FFFFFF', '#FFB8A8', '#A9D2FF', '#B9EBD8', '#FFE08A', '#D9C4FF']); x.globalAlpha = .45; x.lineWidth = 18 + r() * 26; x.lineCap = 'round';
    const y0 = r() * Hh, y1 = r() * Hh;
    x.moveTo(-20, y0); x.bezierCurveTo(W * .3, y0 + (r() - .5) * Hh * .8, W * .7, y1 + (r() - .5) * Hh * .8, W + 20, y1); x.stroke();
  }
  const emo = ['🌷', '🌳', '🏠', '⭐', '🐦', '🐈', '🚲', '🎈', '🍎', '🐟', '🌙', '🦋', '🍄', '🐢', '🌻', '☂️', '🍉', '🎸', '🐧', '🍩', '🔑', '🐝', '🍓', '🚀', '🐘', '☕', '🌵', '🍋', '🎁', '🧁', '🐞', '🍀', '🦊', '🐰', '🎨', '📚', '⚽', '🧩', '🫖', '🐙']
    .map(e => [r(), e]).sort((a, b) => a[0] - b[0]).map(e => e[1]);
  const TON = ['#FF9E8F', '#9CC4FF', '#8FDCC4', '#FFD479', '#C3A8F5', '#FFA3C4', '#B5DD8F', '#E5B08A'];
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
    const i = cy * cols + cx, px = cx * B + B / 2 + (r() - .5) * 22, py = cy * B + B / 2 + (r() - .5) * 22;
    x.globalAlpha = .6; x.fillStyle = TON[(i * 3 + Math.floor(r() * TON.length)) % TON.length];
    x.beginPath(); x.arc(px, py, 30 + r() * 14, 0, Math.PI * 2); x.fill();
    x.globalAlpha = 1; x.save(); x.translate(px, py); x.rotate((r() - .5) * .7);
    x.font = `${42 + Math.floor(r() * 16)}px system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
    x.fillText(emo[i % emo.length], 0, 2); x.restore();
  }
  return cv.toDataURL('image/png');
}

/* ---------- günün molası ---------- */
const dailyGames = () => ZM.dailyGames(dayNum(), ORDER);
const dailyDone = () => !!S.daily[dayKey()];
const playedToday = id => S.hist.some(h => h.g === id && h.d === dayKey());

function greeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return ['Günaydın!', 'Çay demlenene kadar beyni de demleyelim.'];
  if (h >= 11 && h < 14) return ['Öğle arası mı?', 'Yemekten önce beyne de bir şeyler yedirelim.'];
  if (h >= 14 && h < 17) return ['Öğleden sonra rehaveti mi?', 'Birkaç küçük oyunla dağıtalım.'];
  return ['Mesai bitti!', 'Günün yorgunluğunu küçük bir molayla atalım.'];
}

const SLOT_AD = { sabah: ['☕', 'Sabah çayıyla', '08–11', 'Sabah çayı vakti!'], ogle: ['🥪', 'Öğle arasında', '12–14', 'Öğle arası geldi!'],
  ikindi: ['🫖', 'İkindi çayıyla', '15–17', 'İkindi çayı vakti!'], aksam: ['🌙', 'Akşam evde', '18–22', 'Akşam molası vakti!'] };

function demliDurum() {
  const days = playedDays(), now = new Date(), si = streakInfo();
  let gap = null;
  for (let i = 0; i < 400; i++) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); if (days.has(dayKey(d))) { gap = i; break; } }
  const m = ZM.mascot({ everPlayed: S.hist.length > 0, playedToday: gap === 0, doneToday: dailyDone(), gap,
    weekday: now.getDay(), weekDone: ZM.weekProgress(days, now).done, hour: now.getHours(), slot: S.slot });
  if (m.key === 'bekliyor' && si.n === 0) m.key = 'ozledim'; // seri bitmişse "bekliyor" demeyelim
  const MESAJ = {
    hosgeldin: ['Merhaba, ben Demli!', 'Beyin de çay gibi: demlenince güzel. Hadi ilk molanı verelim.'],
    tamam: ['Bugünkü mola tamam!', 'Tavşan kanı kıvamındasın. Yarın yine beklerim.'],
    devam: ['Güzel gidiyorsun!', 'Molanı tamamlamaya ne dersin?'],
    ozledim: ['Hoş geldin, özlemişim!', 'Ara vermek gayet normal. Minicik bir molayla devam edelim.'],
    bekliyor: ['Dün yoktun, olur öyle.', 'Serin duruyor: bugün oynarsan kaldığı yerden devam eder.'],
    sonbir: ['Son bir bardak kaldı!', 'Bugünkü molayla haftalık hedefin tamamlanıyor.'],
    yenihafta: ['Yeni hafta, taze demlik!', 'Pazartesi temiz sayfa demek. İlk bardağı dolduralım mı?'],
    cayvakti: [(SLOT_AD[S.slot] || [])[3] || 'Mola vakti!', 'Ben demlendim. Sen hazır mısın?'],
    gece: ['Esnedim de…', 'Yatmadan minicik bir tur atıp uyuyalım mı?'],
    selam: greeting(),
  };
  return { mood: m.mood, key: m.key, t: MESAJ[m.key][0], p: MESAJ[m.key][1] };
}

function konfeti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const k = document.createElement('div'); k.className = 'konfeti';
  const E = ['🎉', '⭐', '☕', '💛', '🌸', '✨'];

  document.body.appendChild(k); setTimeout(() => k.remove(), 2700);
}

window.addEventListener('popstate', () => { if (S.onb) renderHome(); else onboarding(); });
function backHome() { if (history.state && history.state.s === 'sub') history.back(); else renderHome(); }

let deferredPrompt = null;

}

/* ---------- tanışma ve mola saati ---------- */
const slotSecici = () => `<div class="slotlar">${Object.entries(SLOT_AD).map(([k, [e, ad, saat]]) =>
  `<button class="msaat ${S.slot === k ? 'sel' : ''}" data-slot="${k}"><span>${e}</span>${ad}<small>${saat}</small></button>`).join('')}</div>`;
function slotBagla() {
  app.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
    S.slot = S.slot === b.dataset.slot ? null : b.dataset.slot; save();
    app.querySelectorAll('[data-slot]').forEach(x => x.classList.toggle('sel', x.dataset.slot === S.slot));
  });
}
const SLOT_METIN = 'Küçük bir plan yap: <b>“Çayımı alınca molamı veririm.”</b> Böyle “şu olunca şunu yaparım” diyenler, niyetini daha sık gerçekleştiriyor.';

function onboarding(i = 0) {
  const E = [
    ['heyecanli', 'Merhaba, ben Demli!', 'İnce belli bir çay bardağıyım. Günde birkaç dakikalık <b>zihin molalarında</b> sana eşlik edeceğim.'],
    ['mutlu', 'Mola dediğin kısa olur', '<b>6 kelime + 3 küçük oyun</b>, yaklaşık 5 dakika. Vaktin azsa tek oyunluk <b>mini mola</b> da sayılır. Bir gün kaçırırsan serin bozulmaz.'],

  go(`
  <div class="onb">

    <h2>${t}</h2><p>${p}</p>

  <button class="btn" id="n">${son ? 'Başlayalım' : 'Devam'}</button>`);

function slotPage() {
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">Mola saatin</span></div>

/* ---------- bölümler ---------- */
const bolumOf = id => S.bolum[id] || { cur: 1, st: {} };

// Ana sayfadan bir oyuna giriş: ilk kez geliyorsa nereden başlayacağını seçer
function openGame(id) {
  enterSub();
  if (S.bolum[id]) return levelMap(id);
  if (id === 'saray') return sarayDers(() => seviyeSec(id));
  seviyeSec(id);
}

function seviyeSec(id) {
  const g = GAMES[id], sec = [['kolay', 'Yeni başlıyorum', '🌱'], ['orta', 'Biraz ısındım', '☕'], ['zor', 'Zorla beni', '🔥']];
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">${g.name}</span></div>
  <div class="howto">
    <span class="gico" style="background:${g.color}">${ICON[id]}</span>
    <h2>Nereden başlayalım?</h2>
    <p>Bu oyunda <b>${ZM.LEVELS} bölüm</b> var. Bölümler ilerledikçe iş yoğunlaşır. Sana uyan yerden başla.</p>
    <div class="secenekler">${sec.map(([k, ad, e]) => { const n = ZM.START[k]; return `
      <button class="card secenek" data-n="${n}"><span>${e}</span><span class="ginfo"><b>${ad}</b><small>Bölüm ${n} · ${g.ozet(ZM.levelParams(id, n))}</small></span></button>`; }).join('')}
    </div>
  </div>`);
  $('#x').onclick = backHome;
  app.querySelectorAll('.secenek').forEach(b => b.onclick = () => { S.bolum[id] = { cur: +b.dataset.n, st: {} }; save(); levelMap(id); });
}

function levelMap(id) {
  const g = GAMES[id], b = bolumOf(id), tot = ZM.totalStars(b);
  const kat = t => {
    const a = t * 10 + 1;
    return `<h3 class="kat">Bölüm ${a}–${a + 9}<small>${g.ozet(ZM.levelParams(id, a))}</small></h3>
    <div class="bolumler">${Array.from({ length: 10 }, (_, i) => {
      const n = a + i, st = b.st[n] || 0, acik = n <= b.cur;
      return `<button class="bl ${acik ? (n === b.cur ? 'simdi' : 'acik') : 'kilit'}" data-n="${n}" ${acik ? '' : 'disabled'} aria-label="Bölüm ${n}${acik ? '' : ' (kilitli)'}">
        ${acik ? `<b>${n}</b>${yildizHTML(st)}` : `<b>🔒</b><small>${n}</small>`}</button>`;
    }).join('')}</div>`;
  };
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">${g.name}</span><span class="gs">⭐ ${tot}/${ZM.LEVELS * 3}</span></div>
  <div class="card devam" style="border-color:${g.color}">
    <span class="gico" style="background:${g.color}">${ICON[id]}</span>
    <span class="ginfo"><b>Bölüm ${b.cur}</b><small>${g.ozet(ZM.levelParams(id, b.cur))}</small></span>
    <button class="btn" id="oyna">Oyna</button>
  </div>
  <button class="btn ghost kur-btn" id="kur">🎛 Kendin kur · serbest bölüm</button>
  ${Array.from({ length: ZM.LEVELS / 10 }, (_, t) => kat(t)).join('')}
  ${b.cur < ZM.LEVELS ? '<button class="link" id="atla">Bu bölümler kolay mı? 10 bölüm ileri atla</button>' : ''}`);
  $('#x').onclick = backHome;
  $('#oyna').onclick = () => playGame(id, null, b.cur, 'map');
  $('#kur').onclick = () => kurScreen(id, 'map');
  app.querySelectorAll('.bl:not(.kilit)').forEach(x => x.onclick = () => playGame(id, null, +x.dataset.n, 'map'));
  const atla = $('#atla'); if (atla) atla.onclick = () => { S.bolum[id] = ZM.skipAhead(S.bolum[id]); save(); levelMap(id); };
  if (b.cur > 10) { const s = $('.bl.simdi'); if (s && s.scrollIntoView) s.scrollIntoView({ block: 'center' }); }
}

// from === 'map' ise ✕ bölüm haritasına döner
function playGame(id, ctx, n, from) {
  const g = GAMES[id], b = bolumOf(id);
  n = n || b.cur;
  const P = ZM.levelParams(id, n), eski = b.st[n] || 0, ilk = ZM.totalStars(b) === 0;
  const cik = () => (from === 'map' ? levelMap(id) : backHome());
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button>${ctx ? `<span class="progress">Günün Molası · ${ctx.i + 1}/${ctx.daily.length}</span>` : `<span class="gt">${g.name}</span>`}</div>
  <div class="howto">
    <span class="gico" style="background:${g.color}">${ICON[id]}</span>
    <div><span class="tag" style="background:${g.color}">${g.skill}</span></div>
    <h2>${g.name}</h2>
    <div class="card bolum-kart"><b>Bölüm ${n} ${eski ? yildizHTML(eski) : ''}</b><span>${g.ozet(P)}</span><small>🎯 ${g.hedef(P)}</small></div>
    <details class="nasil" ${ilk ? 'open' : ''}><summary>Nasıl oynanır?</summary><p>${g.howto}</p>${g.bilim ? `<p class="bilim">🔬 ${g.bilim}</p>` : ''}</details>
    ${id === 'saray' ? '<button class="link" id="ders">Dersi tekrar gör</button>' : ''}
  </div>
  <button class="btn" id="go">Başla</button>`);
  $('#x').onclick = cik;
  const dr = $('#ders'); if (dr) dr.onclick = () => sarayDers(() => playGame('saray', ctx, n, from));
  $('#go').onclick = async () => { $('#go').disabled = true; if (await geriSay(g)) runGame(id, ctx, n, from); };
}

// Süreli oyunlarda 3-2-1. Sayım sırasında ekrandan çıkıldıysa false döner.
async function geriSay(g) {
  const my = navId;
  if (g.timed) {
    for (const k of [3, 2, 1]) {
      if (navId !== my) return false;
      const c = document.createElement('div'); c.className = 'count'; c.textContent = k; document.body.appendChild(c); beep(440, .08); await sleep(600); c.remove();
    }
  }
  return navId === my;
}

// from: 'map' → bölüm haritası · 'ozel:map' / 'ozel:liste' → Kendin kur ekranı · yoksa ana sayfa
function geriDon(id, from) {
  if (from === 'map') return levelMap(id);
  if (from && from.startsWith('ozel:')) return kurScreen(id, from.slice(5));
  backHome();
}

function runGame(id, ctx, n, from, ozelP) {
  const g = GAMES[id], P = ozelP || ZM.levelParams(id, n);
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">${g.name} <small class="bno">${ozelP ? 'Serbest' : 'Bölüm ' + n}</small></span><span class="gs" id="gs"></span></div>
  <div class="tbar ${g.timed ? '' : 'hide'}"><i id="tb"></i></div>
  <div class="stage" id="stage"></div>`);
  $('#x').onclick = () => geriDon(id, from);
  const gs = $('#gs'), tb = $('#tb');
  let ended = false;
  const my = navId;
  const api = {
    n: ozelP ? null : n,
    stat: t => { gs.textContent = t; },
    time: f => { tb.style.transform = `scaleX(${f})`; tb.style.background = f < .2 ? 'var(--bad)' : 'var(--teal)'; },
    end: (o, detail) => { if (ended || navId !== my) return; ended = true; stopGame(); showResult(id, n, ZM.rate(id, P, o), detail, ctx, from, ozelP); },
  };
  cleanup = g.start($('#stage'), api, P) || null;
}

function showResult(id, n, stars, detail, ctx, from, ozelP) {
  if (ozelP) return ozelSonuc(id, stars, detail, from, ozelP);
  const g = GAMES[id], once = bolumOf(id), eski = once.st[n] || 0;
  S.bolum[id] = ZM.applyResult(S.bolum[id], n, stars);
  S.hist.push({ g: id, s: stars, b: n, d: dayKey(), t: Date.now() });
  if (S.hist.length > 2000) S.hist = S.hist.slice(-2000);
  const last = ctx && ctx.i === ctx.daily.length - 1;
  if (last) S.daily[ctx.k || dayKey()] = true;
  save();
  const gecti = stars > 0, acildi = gecti && n >= once.cur && n < ZM.LEVELS;
  let verdict = ['Bu sefer olmadı. Bir daha dene, olur.', 'Bölüm geçildi! Tekrar oynarsan yıldız toplarsın.', 'Çok iyi! Bir yıldız daha kapabilirsin.', 'Kusursuz! Üç yıldız.'][stars];
  if (gecti && n === ZM.LEVELS) verdict = 'Son bölümü de bitirdin. Ustasın!';
  else if (eski && stars > eski) verdict += ' Önceki denemenden daha iyi.';
  if (gecti) buzz([30, 40, 30]);
  let dugmeler;
  if (ctx && !last) dugmeler = `<button class="btn" id="next">Sıradaki: ${GAMES[ctx.daily[ctx.i + 1]].name}</button>`;
  else if (ctx) dugmeler = '<button class="btn" id="fin">Molayı bitir</button>';
  else if (gecti && n < ZM.LEVELS) dugmeler = `<button class="btn" id="ileri">Bölüm ${n + 1}</button><button class="link" id="again">Bu bölümü tekrar oyna</button><button class="link" id="map" style="margin-top:0">Bütün bölümler</button>`;
  else dugmeler = `<button class="btn" id="again">${gecti ? 'Tekrar oyna' : 'Tekrar dene'}</button><button class="link" id="map">Bütün bölümler</button>`;
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button>${ctx ? `<span class="progress">Günün Molası · ${ctx.i + 1}/${ctx.daily.length}</span>` : `<span class="gt">${g.name}</span>`}</div>
  <div class="result">
    ${yildizHTML(stars, 'buyuk')}
    <h2 style="font-size:28px">${gecti ? `Bölüm ${n} tamam!` : `Bölüm ${n}`}</h2>
    <p class="verdict">${verdict}</p>
    <p class="detail">${detail}</p>
    ${acildi ? `<p class="yildiz">🔓 Bölüm ${n + 1} açıldı</p>` : ''}
  </div>
  ${dugmeler}`);
  if (stars === 3) konfeti();
  $('#x').onclick = () => geriDon(id, from);
  const nx = $('#next'); if (nx) nx.onclick = () => playGame(ctx.daily[ctx.i + 1], { ...ctx, i: ctx.i + 1 });
  const f = $('#fin'); if (f) f.onclick = () => {
    const k = ctx.k || dayKey(), w = S.words[k];
    if (w && w.now === undefined) recallScreen(k, 'now', ctx, () => dailySummary(ctx.daily, k));
    else dailySummary(ctx.daily, k);
  };
  const il = $('#ileri'); if (il) il.onclick = () => playGame(id, null, n + 1, from);
  const a = $('#again'); if (a) a.onclick = () => playGame(id, null, n, from);
  const mp = $('#map'); if (mp) mp.onclick = () => levelMap(id);
}

/* ---------- Serbest Bölüm: Kendin kur ---------- */
function serbestListe() {

    <p>Hangi oyunda kendi bölümünü kurmak istersin? Serbest bölümler yıldız verir, günün serisine sayılır; 100 bölümlük ilerlemeni etkilemez.</p>
    <div class="secenekler">${[...ORDER, 'saray', ...BULMACA].map(id => `
      <button class="card secenek" data-id="${id}"><span class="gico" style="background:${GAMES[id].color}">${ICON[id]}</span><span class="ginfo"><b>${GAMES[id].name}</b><small>${GAMES[id].ozet(ZM.customParams(id, S.ozel[id]))}</small></span></button>`).join('')}
    </div>
  </div>`);
  $('#x').onclick = backHome;

// kaynak: 'map' (bölüm haritasından) ya da 'liste' (ana sayfadaki Serbest bölüm listesinden)
function kurScreen(id, kaynak) {
  const g = GAMES[id], spec = ZM.OZEL[id];
  let v = ZM.customValues(id, S.ozel[id]);
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">Kendin kur</span></div>
  <div class="kur">
    <div class="kur-bas"><span class="gico" style="background:${g.color}">${ICON[id]}</span><div><b>${g.name}</b><small>Yoğunluğu sen belirle</small></div></div>
    <div id="kurIc"></div>
  </div>
  <button class="btn" id="go">Bölümü üret ve oyna</button>`);
  $('#x').onclick = () => (kaynak === 'map' ? levelMap(id) : serbestListe());
  const ic = $('#kurIc');
  const yaz = c => c.kare ? `${v[c.k]}×${v[c.k]}` : `${v[c.k] * (c.carp || 1)}${c.birim ? ' ' + c.birim : ''}`;
  function ciz() {
    const P = ZM.customParams(id, v);
    ic.innerHTML = spec.map(c => {
      const pasif = id === 'hesap' && v.ops === 'x' && c.k === 'terms';
      if (c.sec) return `<div class="kr"><span>${c.ad}</span><span class="seg">${c.sec.map(([val, ad], i) =>
        `<button data-k="${c.k}" data-i="${i}" class="${v[c.k] === val ? 'on' : ''}">${ad}</button>`).join('')}</span></div>`;
      return `<div class="kr ${pasif ? 'pasif' : ''}"><span>${c.ad}</span><span class="adim">
        <button data-k="${c.k}" data-d="-1" ${pasif || v[c.k] <= c.min ? 'disabled' : ''} aria-label="${c.ad} azalt">−</button>
        <b>${yaz(c)}</b>
        <button data-k="${c.k}" data-d="1" ${pasif || v[c.k] >= c.max ? 'disabled' : ''} aria-label="${c.ad} artır">+</button></span></div>`;
    }).join('') + `<div class="card bolum-kart"><b>Bu bölüm</b><span>${g.ozet(P)}</span><small>🎯 ${g.hedef(P)}</small></div>`;
  }
  ic.addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b || b.disabled) return;
    const c = spec.find(x => x.k === b.dataset.k);
    const yeni = Object.assign({}, v);
    if (c.sec) yeni[c.k] = c.sec[+b.dataset.i][0]; else yeni[c.k] = v[c.k] + (+b.dataset.d) * (c.step || 1);
    v = ZM.customValues(id, yeni); S.ozel[id] = v; save(); beep(520, .04); ciz();
  });
  ciz();
  $('#go').onclick = async () => { $('#go').disabled = true; if (await geriSay(g)) runGame(id, null, null, 'ozel:' + kaynak, ZM.customParams(id, v)); };
}

function ozelSonuc(id, stars, detail, from, P) {
  const g = GAMES[id], gecti = stars > 0;
  S.hist.push({ g: id, s: stars, oz: 1, d: dayKey(), t: Date.now() }); // bölüm ilerlemesine yazılmaz; gün (seri) sayılır
  if (S.hist.length > 2000) S.hist = S.hist.slice(-2000);
  save();
  if (gecti) buzz([30, 40, 30]);
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">${g.name}</span></div>
  <div class="result">
    ${yildizHTML(stars, 'buyuk')}
    <h2 style="font-size:28px">${gecti ? 'Serbest bölüm tamam!' : 'Serbest bölüm'}</h2>
    <p class="verdict">${['Bu sefer olmadı. Ayarı biraz hafifletip yine dene.', 'Geçtin! Tekrar oynarsan yıldız toplarsın.', 'Çok iyi! Bir yıldız daha kapabilirsin.', 'Kusursuz! İstersen yoğunluğu artır.'][stars]}</p>
    <p class="detail">${detail}</p>
    <p class="detail">${g.ozet(P)}</p>
  </div>
  <button class="btn" id="again">Aynı ayarla tekrar</button>
  <button class="link" id="ayar">Ayarları değiştir</button>`);
  if (stars === 3) konfeti();
  $('#x').onclick = () => geriDon(id, from);
  $('#ayar').onclick = () => geriDon(id, from);
  $('#again').onclick = async () => { $('#again').disabled = true; if (await geriSay(g)) runGame(id, null, null, from, P); };
}

function dailySummary(ids, k = dayKey()) {
  const st = streak();
  const lines = ['Beyin demlendi, mola tamam. Yarın yeni oyunlar var!', 'Mola bitti, çay soğumadan masaya dön.', 'Bugünkü jimnastik tamam. Yarın aynı saatte?', 'Güzel mola oldu. Şimdi bir bardak su iç, gözlerini dinlendir.'];
  const son = id => histOf(id).filter(h => h.b).pop();
  // günün yıldızı: mola güzel bir anla bitsin
  const yildiz = ZM.starOfDay(ids.map(id => { const h = son(id); return h ? { id, stars: h.s, n: h.b } : null; }).filter(Boolean));
  const wk = ZM.weekProgress(playedDays(), new Date());
  go(`
  <div class="result">
    <div class="ozet-demli">${demli('gururlu')}</div>
    <h2 style="font-size:30px">Mola tamam!</h2>
    <p class="verdict">${pick(lines)}</p>
    <p class="detail">${st ? `🔥 ${st} gün üst üste · ` : ''}bu hafta ${wk.done}/${wk.goal} bardak${wk.done >= wk.goal ? ' 🎉' : ''}</p>
    ${yildiz ? `<p class="yildiz">⭐ Günün yıldızı: <b>${GAMES[yildiz.id].name}</b> · Bölüm ${yildiz.n}</p>` : ''}
    <div class="sumlist">${ids.map(id => { const h = son(id); return `
      <div class="card"><span class="gico" style="background:${GAMES[id].color}">${ICON[id]}</span><span>${GAMES[id].name}<small class="bno">${h ? 'Bölüm ' + h.b : ''}</small></span><b>${h ? yildizHTML(h.s, 'orta') : '–'}</b></div>`; }).join('')}
      ${S.words[k] && S.words[k].now !== undefined ? `
      <div class="card"><span class="gico" style="background:${WORD_COLOR}">${ICON.kelime}</span><span>Günün Kelimeleri</span><b>${S.words[k].now}/6</b></div>` : ''}
    </div>
  </div>
  <button class="btn" id="home">Ana sayfa</button>
  <button class="link" id="paylas">💌 Bir arkadaşını molaya çağır</button>`);
  $('#home').onclick = backHome;
  $('#paylas').onclick = async () => {
    const text = ZM.shareText(st, location.origin + location.pathname);
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); $('#paylas').textContent = 'Davet metni kopyalandı ✓'; }
    } catch (e) {}
  };
  konfeti();
}

/* ---------- Günün Kelimeleri ---------- */
const WORD_COLOR = '#7DB85A';
function recentWords() {
  const s = new Set();
  for (let i = 0; i < 3; i++) { const d = new Date(); d.setDate(d.getDate() - i); const r = S.words[dayKey(d)]; if (r) r.w.forEach(w => s.add(w)); }
  return s;
}

function startDaily(dg) {
  const ctx = { daily: dg, i: 0, k: dayKey() }; // mola başladığı günün anahtarı (gece yarısını geçse de)
  if (dailyDone()) return playGame(dg[0], ctx); // bugünkü mola bitti; "bir tur daha" yalnız oyun
  const y = ZM.pendingRecall(S.words, new Date());
  if (y) return recallScreen(y, 'next', ctx, () => studyWords(ctx));
  studyWords(ctx);
}

function studyWords(ctx) {
  const k = ctx.k;
  if (S.words[k]) return playGame(ctx.daily[0], ctx); // bugün zaten çalışıldı
  const w = ZM.pickWords(ZM.KELIMELER, 6, Math.random, recentWords());
  S.words[k] = { w }; save();
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="progress">Günün Molası · Kelimeler</span></div>
  <div class="tbar"><i id="tb"></i></div>
  <div class="howto" style="gap:18px">
    <h2>Günün Kelimeleri</h2>
    <p>Bu 6 kelimeyi aklında tut. İpucu: hepsini <b>tek bir saçma hikâyede</b> birleştir. Molanın sonunda soracağız, yarın da bir daha!</p>
    <div class="wgrid">${w.map(x => `<div class="wcard">${x}</div>`).join('')}</div>
  </div>
  <button class="btn" id="ready">Hazırım</button>`);
  $('#x').onclick = backHome;
  const tb = $('#tb');
  const t = makeTimer(20000, l => { tb.style.transform = `scaleX(${l / 20000})`; }, () => playGame(ctx.daily[0], ctx));
  cleanup = () => t.stop();
  $('#ready').onclick = () => playGame(ctx.daily[0], ctx);
}

function recallScreen(k, mode, ctx, next) {
  const targets = S.words[k].w;
  const others = ZM.pickWords(ZM.KELIMELER, 6, Math.random, new Set([...recentWords(), ...targets]));
  const tiles = shuffle([...targets, ...others]);
  const title = mode === 'next' ? 'Dünün Kelimeleri' : 'Kelimeler geri dönüyor!';
  const sub = mode === 'next' ? 'Dün aklında tuttuğun 6 kelime vardı. Bakalım bir gece uykudan sonra neler kalmış?' : 'Molanın başında gördüğün 6 kelimeyi seç.';
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="progress">Günün Molası · Hatırlama</span><span class="gs" id="cnt">0/6</span></div>
  <div class="howto" style="gap:14px">
    <h2>${title}</h2>
    <p>${sub}</p>
    <div class="wgrid pick">${tiles.map(x => `<button class="wcard" data-w="${x}">${x}</button>`).join('')}</div>
    <p class="fb" id="rmsg"></p>
  </div>
  <button class="btn" id="check">Kontrol et</button>`);
  $('#x').onclick = backHome;
  const chosen = new Set(), cnt = $('#cnt'), msg = $('#rmsg');
  let checked = false;
  $('.wgrid', app).addEventListener('click', e => {
    const b = e.target.closest('.wcard'); if (!b || checked) return;
    const w = b.dataset.w;
    if (chosen.has(w)) { chosen.delete(w); b.classList.remove('sel'); }
    else if (chosen.size >= 6) { msg.textContent = 'En fazla 6 kelime seçebilirsin'; msg.className = 'fb bad'; return; }
    else { chosen.add(w); b.classList.add('sel'); beep(520, .04); }
    msg.textContent = ''; cnt.textContent = `${chosen.size}/6`;
  });
  $('#check').onclick = () => {
    if (checked) return next();
    checked = true;
    const sc = ZM.recallScore([...chosen], targets);
    S.words[k][mode] = sc;
    if (mode === 'now') S.hist.push({ g: 'kelime', s: sc, d: dayKey(), t: Date.now() });
    save();
    app.querySelectorAll('.wgrid .wcard').forEach(b => {
      const w = b.dataset.w, t = targets.includes(w), c = chosen.has(w);
      b.classList.add(t && c ? 'hit' : c ? 'fa' : t ? 'miss' : 'dim');
    });
    msg.className = 'fb ' + (sc >= 4 ? 'ok' : 'bad');
    msg.innerHTML = (sc === 6 ? '6/6! Hafızan bugün jilet gibi.' : sc >= 4 ? `${sc}/6, çok iyi.` : `${sc}/6. Hikâye kurmayı dene, fark edeceksin.`) +
      '<br><small style="color:var(--soft);font-weight:500">yeşil: doğru · kırmızı: yanlış seçim · sarı: kaçan</small>';
    $('#check').textContent = 'Devam';
    if (sc >= 4) buzz([30, 40, 30]);
  };
}

if (S.onb) renderHome(); else onboarding();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
