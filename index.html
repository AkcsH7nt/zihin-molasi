<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zihin Molası">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zihin Molası</title>
<style>
:root{
  --bg:#FBF6EE;--card:#FFFFFF;--ink:#2B2A33;--soft:#6B6878;--line:#ECE4D8;
  --coral:#F26B5B;--coral-d:#C9503F;--teal:#2A9D8F;--mustard:#E0A526;--plum:#7B5EA7;
  --ok:#2E9E5B;--bad:#E04848;
  --shadow:0 1px 0 rgba(43,42,51,.05),0 8px 24px rgba(43,42,51,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#18171D;--card:#24232B;--ink:#F3EFE8;--soft:#A7A3B3;--line:#363441;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
h1,h2,h3,p{margin:0}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--coral);color:#fff;font-weight:750;
  font-size:18px;box-shadow:0 4px 0 var(--coral-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.link{display:block;margin:14px auto 0;color:var(--soft);font-size:15px;padding:8px 12px}

/* ana sayfa */
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.top .brand{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.top h1{font-size:28px;line-height:1.15;margin-top:4px}
.top .sub{color:var(--soft);margin-top:6px;font-size:16px;line-height:1.4}
.icon-btn{margin-left:auto;flex:none;width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-size:20px;display:grid;place-items:center}
.streak{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.streak .fire{font-size:30px}
.streak b{font-size:20px}
.streak small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.week{display:flex;justify-content:space-between;width:100%;padding-top:12px;border-top:1px solid var(--line)}
.week span{width:30px;text-align:center;font-size:10px;color:var(--soft)}
.week span i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 3px;background:var(--line)}
.week span.on i{background:var(--coral)}
.week span.today{color:var(--ink);font-weight:700}
.daily{margin-bottom:22px;background:linear-gradient(135deg,#FFF1E6,#FFE4DC);border-color:#F8D3C6}
@media (prefers-color-scheme:dark){.daily{background:linear-gradient(135deg,#2E2630,#352A2C);border-color:#463639}}
.daily h2{font-size:21px}
.daily p{color:var(--soft);margin:4px 0 12px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:14px;font-weight:600}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.done{opacity:.55;text-decoration:line-through}
.sec{font-size:15px;color:var(--soft);font-weight:700;margin:0 4px 10px;text-transform:uppercase;letter-spacing:.06em}
.games{display:flex;flex-direction:column;gap:10px}
.grow{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.gico{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff}
.gico svg{width:28px;height:28px}
.ginfo{flex:1;min-width:0}
.ginfo b{display:block;font-size:17px}
.ginfo small{color:var(--soft);font-size:13px}
.gbest{text-align:right;font-size:12px;color:var(--soft)}
.gbest b{display:block;font-size:18px;color:var(--ink)}
.spark{display:block;margin-top:2px}
.install{margin-bottom:14px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.35}
.install .x{margin-left:auto;color:var(--soft);font-size:18px;padding:6px}
.install .btn{width:auto;padding:10px 14px;font-size:15px}
.foot{color:var(--soft);font-size:12px;text-align:center;margin-top:24px;line-height:1.5}

/* oyun ekranı */
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gtop .close{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.gtop .gt{font-weight:700;font-size:17px}
.gtop .gs{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.tbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
.tbar i{display:block;height:100%;width:100%;background:var(--teal);border-radius:99px;transform-origin:left;transition:transform .1s linear}
.tbar.hide{visibility:hidden}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px 0 20px;user-select:none;-webkit-user-select:none}

/* nasıl oynanır */
.howto{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.howto .gico{width:84px;height:84px;border-radius:26px;margin:0 auto}
.howto .gico svg{width:46px;height:46px}
.howto h2{font-size:28px}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.howto p{color:var(--soft);font-size:17px;line-height:1.5;max-width:360px;margin:0 auto}
.howto p b{color:var(--ink)}
.progress{font-size:14px;color:var(--soft);font-weight:600}
.count{position:fixed;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:var(--coral);
  background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:10;animation:pop .55s ease-out}
@keyframes pop{from{transform:scale(1.12)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Sıra Hafızası */
.msg{text-align:center;font-size:22px;font-weight:700;min-height:30px;color:var(--soft)}
.msg.go{color:var(--teal)}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px;margin:0 auto}
.tile{aspect-ratio:1;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);
  transition:background .12s,transform .12s}
.tile.on{background:var(--coral);border-color:var(--coral);transform:scale(.95)}
.tile.bad{background:var(--bad);border-color:var(--bad)}
.tile.hint{border-color:var(--teal);border-width:4px}

/* Renk Tuzağı */
.rule{align-self:center;padding:8px 16px;border-radius:999px;color:#fff;font-weight:750;font-size:17px;background:var(--plum)}
.rule.anlam{background:var(--teal)}
.rule.flip{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.word{text-align:center;font-size:54px;font-weight:850;letter-spacing:.02em;min-height:72px}
.word.pop{animation:pop .2s ease-out}
.choices4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{padding:22px 8px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);
  font-size:19px;font-weight:750}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.fb{text-align:center;font-weight:700;min-height:24px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}

/* Hızlı Hesap */
.q{text-align:center;font-size:56px;font-weight:850;font-variant-numeric:tabular-nums;min-height:76px}
.q.pop{animation:pop .18s ease-out}
.lvl{text-align:center;color:var(--soft);font-weight:600}

/* Eşini Bul */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px;margin:0 auto}
.c3{aspect-ratio:3/4;position:relative;transform-style:preserve-3d;transition:transform .32s;border-radius:14px}
.c3.open,.c3.done{transform:rotateY(180deg)}
.c3 .f,.c3 .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center}
.c3 .b{background:var(--mustard);background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.5px);
  background-size:12px 12px;box-shadow:0 3px 0 #B98516}
.c3 .f{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);font-size:34px}
.c3.done .f{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}

/* İki Önce */
.nb-card{width:200px;height:200px;margin:0 auto;border-radius:32px;background:var(--card);border:2px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center}
.nb-card.pop{animation:pop .18s ease-out}
.nb-sym{font-size:110px;line-height:1;color:#3D7DD8}
.nb-btn{background:#3D7DD8;box-shadow:0 4px 0 #2A5EA8;padding:22px}
.nb-btn.ok{background:var(--ok);box-shadow:0 4px 0 #1F7442}
.nb-btn.bad{background:var(--bad);box-shadow:0 4px 0 #A83232}

/* Göz Ucu */
.goz{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:28px;background:var(--card);border:2px solid var(--line)}
.goz .slot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;display:grid;place-items:center;font-size:36px;line-height:1;border-radius:50%}
.goz .mid{left:50%;top:50%;font-size:46px;width:64px;height:64px;margin:-32px 0 0 -32px;color:var(--soft)}
.goz.mask .slot{background:repeating-linear-gradient(45deg,var(--soft) 0 3px,transparent 3px 7px);opacity:.6}
.goz.ask .per{border:3px dashed var(--line);cursor:pointer}
.goz.ask .per:active{background:var(--line)}
.goz .per.right{border:3px solid var(--ok)}
.goz .per.wrong{border:3px solid var(--bad)}
.goz-ans{min-height:150px}

/* Günün Kelimeleri */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.wgrid.pick{grid-template-columns:1fr 1fr 1fr;gap:8px}
.wcard{padding:16px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:19px;font-weight:750;
  box-shadow:0 3px 0 var(--line)}
.pick .wcard{padding:14px 4px;font-size:15px}
.wcard.sel{background:#5C8A3A;border-color:#5C8A3A;color:#fff}
.wcard.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.wcard.fa{background:var(--bad);border-color:var(--bad);color:#fff;text-decoration:line-through}
.wcard.miss{border-color:var(--mustard);border-style:dashed;color:var(--mustard)}
.wcard.dim{opacity:.4}

/* Hafıza Sarayı */
.sp-place{text-align:center;font-size:26px;font-weight:800}
.sp-arrow{text-align:center;font-size:26px;color:var(--soft)}
.sp-word{align-self:center;padding:22px 34px;border-radius:24px;background:#B5654A;color:#fff;font-size:34px;font-weight:850;
  box-shadow:0 5px 0 #8A4A35}
.sp-hint{text-align:center;color:var(--soft);font-size:16px;line-height:1.45}
.choice.c-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.c-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bilim{font-size:14px!important;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.saray-card{display:flex;align-items:center;gap:14px;margin-bottom:22px;text-align:left;width:100%}

/* Bilim sayfası */
.bilimlist{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.bilimlist b{font-size:17px}
.bilimlist p{color:var(--soft);font-size:15px;line-height:1.45;margin:6px 0 8px}
.bilimlist a{color:var(--teal);font-size:13px;font-weight:600;text-decoration:none}

/* sonuç */
.result{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px}
.result .big{font-size:84px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
.result .unit{color:var(--soft);font-size:16px;font-weight:600}
.result .verdict{font-size:20px;font-weight:700;line-height:1.35}
.result .detail{color:var(--soft);font-size:15px}
.result .stats{display:flex;gap:10px;justify-content:center}
.result .stats .card{padding:10px 16px;min-width:100px}
.result .stats small{display:block;color:var(--soft);font-size:12px}
.result .stats b{font-size:20px}
.newbest{align-self:center;background:var(--mustard);color:#fff;padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}
.sumlist{display:flex;flex-direction:column;gap:8px;text-align:left}
.sumlist .card{display:flex;align-items:center;gap:12px;padding:12px 14px}
.sumlist .gico{width:40px;height:40px;border-radius:12px}
.sumlist .gico svg{width:22px;height:22px}
.sumlist b{margin-left:auto;font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<script src="mantik.js"></script>
<script src="kelimeler.js"></script>
<script>
'use strict';
/* ---------- yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const { dayKey, dayNum } = ZM;

/* ---------- kayıt (telefonun içinde) ---------- */
const KEY = 'zihinmolasi.v1';
let S;
try { S = ZM.loadState(JSON.parse(localStorage.getItem(KEY))); } catch (e) { S = ZM.loadState(null); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const histOf = id => S.hist.filter(h => h.g === id);
const bestOf = id => { const h = histOf(id); return h.length ? Math.max(...h.map(x => x.s)) : null; };
const playedDays = () => new Set(S.hist.map(h => h.d));
const streakInfo = () => ZM.streak(playedDays(), new Date());
const streak = () => streakInfo().n;

/* ---------- ses ve titreşim ---------- */
let actx;
function beep(f = 520, d = .08, type = 'sine', vol = .07) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- süre sayacı (uygulama arka plana gidince durur) ---------- */
function makeTimer(total, onTick, onEnd) {
  let left = total, last = performance.now(), dead = false;
  const vis = () => { last = performance.now(); };
  document.addEventListener('visibilitychange', vis);
  const iv = setInterval(() => {
    const now = performance.now();
    if (!document.hidden) left -= now - last;
    last = now;
    if (left <= 0) { stop(); onTick(0); onEnd(); return; }
    onTick(left);
  }, 100);
  function stop() { if (dead) return; dead = true; clearInterval(iv); document.removeEventListener('visibilitychange', vis); }
  onTick(left);
  return { stop };
}

/* ---------- simgeler ---------- */
const ICON = {
  sira: '<svg viewBox="0 0 24 24" fill="currentColor">' + [0,1,2,3,4,5,6,7,8].map(i =>
    `<rect x="${2 + (i % 3) * 7}" y="${2 + Math.floor(i / 3) * 7}" width="6" height="6" rx="1.6" opacity="${[0,4,8,5].includes(i) ? 1 : .35}"/>`).join('') + '</svg>',
  renk: '<svg viewBox="0 0 24 24"><text x="12" y="17.5" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor" font-family="system-ui,sans-serif">Aa</text></svg>',
  es: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="9" height="13" rx="2" transform="rotate(-8 7.5 11.5)"/><rect x="12" y="5" width="9" height="13" rx="2" opacity=".55" transform="rotate(8 16.5 11.5)"/></svg>',
  iki: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6 5 12l6 6M19 6l-6 6 6 6"/></svg>',
  goz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  kelime: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></svg>',
  saray: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 7v2h18V7z"/><rect x="5" y="10" width="2.4" height="8" rx=".6"/><rect x="10.8" y="10" width="2.4" height="8" rx=".6"/><rect x="16.6" y="10" width="2.4" height="8" rx=".6"/><rect x="3" y="19" width="18" height="2.4" rx=".6"/></svg>',
  hesap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 3.5v7M3.5 7h7M14 7h6.5M15 15l5 5M20 15l-5 5M3.5 17.5h7"/></svg>',
};

/* ---------- oyunlar ---------- */
const PRAISE = ['Harika!', 'Süper!', 'Tam isabet!', 'Beyin ısındı!', 'Aferin!', 'Çok iyi!'];

const GAMES = {
  sira: {
    name: 'Sıra Hafızası', skill: 'Hafıza', color: '#F26B5B', unit: 'kare', timed: false,
    howto: 'Kareler sırayla yanacak. <b>İzle</b>, sonra <b>aynı sırayla</b> dokun. Her doğru turda sıra bir kare uzar. <b>2 hata</b> hakkın var.',
    bilim: 'Araştırmacıların kısa süreli görsel belleği ölçmek için kullandığı “Corsi blokları” görevinin bir türüdür.',
    start(stage, api) {
      let alive = true, len = ZM.startLevel(S.lvl.sira, 3, 9), best = 0, lives = 2, seq = [], idx = 0, accept = false;
      stage.innerHTML = '<div class="msg">İzle…</div><div class="grid9">' +
        Array.from({ length: 9 }, (_, i) => `<button class="tile" data-i="${i}" aria-label="Kare ${i + 1}"></button>`).join('') + '</div>';
      const tiles = [...stage.querySelectorAll('.tile')], m = $('.msg', stage);
      const stat = () => api.stat(`Sıra ${len} · ${'♥'.repeat(lives)}${'♡'.repeat(2 - lives)}`);
      const say = (t, c = '') => { m.textContent = t; m.className = 'msg ' + c; };
      async function light(i, ms, cls = 'on') { tiles[i].classList.add(cls); await sleep(ms); tiles[i].classList.remove(cls); }
      async function round() {
        if (!alive) return;
        accept = false; idx = 0; seq = [];
        for (let k = 0; k < len; k++) { let t; do t = rnd(9); while (k && t === seq[k - 1]); seq.push(t); }
        stat(); say('İzle…'); await sleep(750);
        const on = Math.max(380, 640 - len * 25);
        for (const i of seq) { if (!alive) return; beep(330 + i * 55, on / 1000 * .8); await light(i, on); await sleep(170); }
        if (!alive) return;
        say('Sıra sende', 'go'); accept = true;
      }
      stage.querySelector('.grid9').addEventListener('pointerdown', async e => {
        const b = e.target.closest('.tile'); if (!b || !accept) return;
        const i = +b.dataset.i;
        if (i === seq[idx]) {
          idx++; beep(330 + i * 55, .08); light(i, 170);
          if (idx === seq.length) {
            accept = false; best = len; len++; say(pick(PRAISE), 'ok'); beep(880, .12);
            await sleep(850); round();
          }
        } else {

}

/* ---------- günün molası ---------- */
const dailyGames = () => ZM.dailyGames(dayNum(), ORDER);
const dailyDone = () => !!S.daily[dayKey()];
const playedToday = id => S.hist.some(h => h.g === id && h.d === dayKey());

function greeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return ['Günaydın!', 'Çay demlenene kadar beyni de demleyelim.'];
  if (h >= 11 && h < 14) return ['Öğle arası mı?', 'Yemekten önce beyne de bir şeyler yedirelim.'];
  if (h >= 14 && h < 17) return ['Öğleden sonra rehaveti?', 'Üç küçük oyunla dağıtalım.'];
  if (h >= 17 && h < 22) return ['Mesai bitti!', 'Beyin hâlâ ayakta mı? Bakalım.'];
  return ['Gece kuşu musun?', 'Kısa bir tur atıp uyuyalım.'];
}

/* ---------- ekranlar ---------- */
let cleanup = null;
function stopGame() { if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; } }
let navId = 0; // her ekran değişiminde artar; eski ekrandan gelen geç olaylar yok sayılır
function go(html) { stopGame(); navId++; app.innerHTML = html; window.scrollTo(0, 0); }
function enterSub() { if (!history.state || history.state.s !== 'sub') history.pushState({ s: 'sub' }, ''); }
window.addEventListener('popstate', () => { renderHome(); });
function backHome() { if (history.state && history.state.s === 'sub') history.back(); else renderHome(); }

function spark(id) {
  const v = histOf(id).slice(-7).map(h => h.s);
  if (v.length < 2) return '';
  const max = Math.max(...v), min = Math.min(...v), W = 60, H = 18;
  const pts = v.map((s, i) => `${(i / (v.length - 1) * W).toFixed(1)},${(H - 2 - (max === min ? .5 : (s - min) / (max - min)) * (H - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${GAMES[id].color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if ($('.home')) renderHome(); });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

function installCard() {
  if (isStandalone() || S.hideInstall) return '';
  let body;
  if (deferredPrompt) body = '<div><b>Telefona yükle</b><br>Ana ekranda uygulama gibi dursun.</div><button class="btn" id="inst" style="margin-left:auto">Yükle</button>';
  else if (isIOS()) body = '<div><b>Ana ekrana ekle:</b> alttaki Paylaş <span aria-hidden="true">⬆︎</span> düğmesi → “Ana Ekrana Ekle”.</div>';
  else body = '<div><b>Ana ekrana ekle:</b> Chrome’da sağ üstteki ⋮ menüsü → “Ana ekrana ekle” ya da “Uygulamayı yükle”.</div>';
  return `<div class="card install">${body}<button class="x" id="hideInst" aria-label="Kapat">✕</button></div>`;
}

function renderHome() {
  stopGame(); navId++;
  const [hi, sub] = greeting(), si = streakInfo(), st = si.n, days = playedDays(), dg = dailyGames(), done = dailyDone();
  const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d; });
  const DN = ['Pz', 'Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct'];
  app.innerHTML = `
  <div class="home">
    <header class="top">
      <div><div class="brand">Zihin Molası</div><h1>${hi}</h1><p class="sub">${sub}</p></div>
      <button class="icon-btn" id="snd" aria-label="Ses">${S.sound ? '🔊' : '🔇'}</button>
    </header>
    ${installCard()}
    <section class="card streak">
      <div class="fire">${st ? '🔥' : '🌱'}</div>
      <div><b>${st ? st + ' gün' : 'Yeni başlangıç'}</b><small>${st ? 'üst üste mola verdin' : 'Bugün ilk molanı ver'}${si.shielded ? ' · 🛡 1 boş gün affedildi' : ''}</small></div>
      <div class="week">${week.map(d => `<span class="${days.has(dayKey(d)) ? 'on' : ''} ${dayKey(d) === dayKey() ? 'today' : ''}"><i></i>${DN[d.getDay()]}</span>`).join('')}</div>
    </section>
    <section class="card daily">
      <h2>${done ? 'Bugünkü mola tamam ✓' : 'Günün Molası'}</h2>
      <p>${done ? 'Yarın yeni oyunlar seni bekliyor. İstersen yine oyna.' : '6 kelime + 3 oyun · yaklaşık 5 dakika · her gün değişir'}</p>
      <div class="chips">${dg.map(id => `<span class="chip ${playedToday(id) && done ? 'done' : ''}"><span class="dot" style="background:${GAMES[id].color}"></span>${GAMES[id].name}</span>`).join('')}</div>
      <button class="btn" id="startDaily">${done ? 'Bir tur daha' : 'Molaya başla'}</button>
    </section>
    <h2 class="sec">Hafıza tekniği</h2>
    <button class="card saray-card" id="saray">
      <span class="gico" style="background:${GAMES.saray.color}">${ICON.saray}</span>
      <span class="ginfo"><b>Hafıza Sarayı</b><small>${S.lvl.saray ? `Seviye ${S.lvl.saray} · ${ZM.palaceSize(S.lvl.saray)} kelime` : 'Şampiyonların tekniği · 2 dk ders'}</small></span>
      <span class="gbest">${bestOf('saray') == null ? 'Yeni' : `rekor<b>${bestOf('saray')}</b>`}${spark('saray')}</span>
    </button>
    <h2 class="sec">Tek tek oyna</h2>
    <div class="games">
      ${ORDER.map(id => { const g = GAMES[id], b = bestOf(id); return `
      <button class="card grow" data-g="${id}">
        <span class="gico" style="background:${g.color}">${ICON[id]}</span>
        <span class="ginfo"><b>${g.name}</b><small>${g.skill}</small></span>
        <span class="gbest">${b == null ? 'Yeni' : `rekor<b>${b}</b>`}${spark(id)}</span>
      </button>`; }).join('')}
    </div>
    <button class="btn ghost" id="bilim" style="margin-top:22px">🔬 Bilim ne diyor?</button>
    <p class="foot">Zihin Molası eğlence için hazırlanmış kısa beyin egzersizleridir;<br>tıbbi bir tedavi yerine geçmez. · Prototip</p>
  </div>`;
  $('#snd').onclick = () => { S.sound = !S.sound; save(); if (S.sound) beep(660, .1); renderHome(); };
  $('#startDaily').onclick = () => { enterSub(); startDaily(dg); };
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { enterSub(); playGame(b.dataset.g, null); });
  $('#bilim').onclick = () => { enterSub(); bilimPage(); };
  $('#saray').onclick = () => { enterSub(); if (S.lvl.saray == null) sarayDers(() => playGame('saray', null)); else playGame('saray', null); };
  const hide = $('#hideInst'); if (hide) hide.onclick = () => { S.hideInstall = true; save(); renderHome(); };
  const inst = $('#inst'); if (inst) inst.onclick = async () => { deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {} deferredPrompt = null; renderHome(); };
}

function playGame(id, ctx) {
  const g = GAMES[id];
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button>${ctx ? `<span class="progress">Günün Molası · ${ctx.i + 1}/${ctx.daily.length}</span>` : ''}</div>
  <div class="howto">
    <span class="gico" style="background:${g.color}">${ICON[id]}</span>
    <div><span class="tag" style="background:${g.color}">${g.skill}</span></div>
    <h2>${g.name}</h2>
    <p>${g.howto}</p>
    ${g.bilim ? `<p class="bilim">🔬 ${g.bilim}</p>` : ''}
    ${id === 'saray' ? '<button class="link" id="ders">Dersi tekrar gör</button>' : ''}
  </div>
  <button class="btn" id="go">Başla</button>`);
  $('#x').onclick = backHome;
  const dr = $('#ders'); if (dr) dr.onclick = () => sarayDers(() => playGame('saray', ctx));
  $('#go').onclick = async () => {
    const my = navId; $('#go').disabled = true;
    if (g.timed) {
      for (const n of [3, 2, 1]) {
        if (navId !== my) return;
        const c = document.createElement('div'); c.className = 'count'; c.textContent = n; document.body.appendChild(c); beep(440, .08); await sleep(600); c.remove();
      }
    }
    if (navId !== my) return; // geri sayım sırasında çıkıldı
    runGame(id, ctx);
  };
}

function runGame(id, ctx) {
  const g = GAMES[id];
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">${g.name}</span><span class="gs" id="gs"></span></div>
  <div class="tbar ${g.timed ? '' : 'hide'}"><i id="tb"></i></div>
  <div class="stage" id="stage"></div>`);
  $('#x').onclick = backHome;
  const gs = $('#gs'), tb = $('#tb');
  let ended = false;
  const my = navId;
  const api = {
    stat: t => { gs.textContent = t; },
    time: f => { tb.style.transform = `scaleX(${f})`; tb.style.background = f < .2 ? 'var(--bad)' : 'var(--teal)'; },
    end: (score, detail) => { if (ended || navId !== my) return; ended = true; stopGame(); showResult(id, score, detail, ctx); },
  };
  cleanup = g.start($('#stage'), api) || null;
}

function showResult(id, score, detail, ctx) {
  const g = GAMES[id], prevH = histOf(id), prev = prevH.length ? prevH[prevH.length - 1].s : null, best = bestOf(id);
  const isBest = best != null && score > best;
  S.hist.push({ g: id, s: score, d: dayKey(), t: Date.now() });
  if (S.hist.length > 2000) S.hist = S.hist.slice(-2000);
  const last = ctx && ctx.i === ctx.daily.length - 1;
  if (last) S.daily[ctx.k || dayKey()] = true;
  save();
  let verdict;
  if (prev == null) verdict = 'İlk skorun kaydedildi. Bundan sonra rakibin sensin.';
  else if (isBest) verdict = 'Yeni rekor! Bugün beyin formda.';
  else if (score > prev) verdict = `Geçen seferden ${score - prev} ${g.unit} daha iyi.`;
  else if (score === prev) verdict = 'Geçen seferle aynı. İstikrar da başarıdır.';
  else verdict = 'Geçen seferin biraz altında. Her gün aynı olmaz, yarın yine dene.';
  if (score > 0) buzz([30, 40, 30]);
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button>${ctx ? `<span class="progress">Günün Molası · ${ctx.i + 1}/${ctx.daily.length}</span>` : `<span class="gt">${g.name}</span>`}</div>
  <div class="result">
    ${isBest ? '<span class="newbest">YENİ REKOR</span>' : ''}
    <div><div class="big" style="color:${g.color}">${score}</div><div class="unit">${g.unit}</div></div>
    <p class="verdict">${verdict}</p>
    <p class="detail">${detail}</p>
    <div class="stats">
      <div class="card"><small>Önceki</small><b>${prev == null ? '–' : prev}</b></div>
      <div class="card"><small>Rekor</small><b>${Math.max(score, best ?? 0)}</b></div>
    </div>
  </div>
  ${ctx && !last ? `<button class="btn" id="next">Sıradaki: ${GAMES[ctx.daily[ctx.i + 1]].name}</button>`
    : ctx ? '<button class="btn" id="fin">Molayı bitir</button>'
    : '<button class="btn" id="again">Tekrar oyna</button><button class="link" id="home">Ana sayfa</button>'}`);
  $('#x').onclick = backHome;
  const n = $('#next'); if (n) n.onclick = () => playGame(ctx.daily[ctx.i + 1], { ...ctx, i: ctx.i + 1 });
  const f = $('#fin'); if (f) f.onclick = () => {
    const k = ctx.k || dayKey(), w = S.words[k];
    if (w && w.now === undefined) recallScreen(k, 'now', ctx, () => dailySummary(ctx.daily, k));
    else dailySummary(ctx.daily, k);
  };
  const a = $('#again'); if (a) a.onclick = () => playGame(id, null);
  const h = $('#home'); if (h) h.onclick = backHome;
}

function dailySummary(ids, k = dayKey()) {
  const st = streak();
  const lines = ['Beyin ısındı, mola tamam. Yarın yeni oyunlar var!', 'Mola bitti, çay soğumadan masaya dön.', 'Bugünkü jimnastik tamam. Yarın aynı saatte?', 'Güzel mola oldu. Şimdi bir bardak su iç, gözlerini dinlendir.'];
  go(`
  <div class="result">
    <div style="font-size:64px">☕</div>
    <h2 style="font-size:30px">Mola tamam!</h2>
    <p class="verdict">${pick(lines)}</p>
    <p class="detail">${st} gün üst üste 🔥</p>
    <div class="sumlist">${ids.map(id => { const h = histOf(id).pop(); return `
      <div class="card"><span class="gico" style="background:${GAMES[id].color}">${ICON[id]}</span><span>${GAMES[id].name}</span><b>${h ? h.s : '–'} <small style="color:var(--soft);font-weight:500">${GAMES[id].unit}</small></b></div>`; }).join('')}
      ${S.words[k] && S.words[k].now !== undefined ? `
      <div class="card"><span class="gico" style="background:${WORD_COLOR}">${ICON.kelime}</span><span>Günün Kelimeleri</span><b>${S.words[k].now}/6</b></div>` : ''}
    </div>
  </div>
  <button class="btn" id="home">Ana sayfa</button>`);
  $('#home').onclick = backHome;
}

/* ---------- Bilim ne diyor? ---------- */
const BILIM = [
  ['Oyunda gelişirsin, ama dürüst olalım', 'Beyin oyunları, oynanan oyundaki beceriyi kesin geliştirir. Bunun günlük hayata ne kadar taşındığı ise araştırmalarda sınırlı bulunmuştur. Bu yüzden biz “IQ artırır” demiyoruz.', 'Simons ve ark., 2016', 'https://www.psychologicalscience.org/?p=126532'],
  ['Gerçek hafızaya en çok teknik yarar', 'Hafıza Sarayı tekniğini 6 hafta çalışan sıradan kişiler, hafıza şampiyonlarına yakın sonuç aldı ve 4 ay sonra da korudu.', 'Dresler ve ark., Neuron 2017', 'https://med.stanford.edu/news/all-news/2017/03/memorization-tool-bulks-up-brains-internal-connections.html'],
  ['Hatırlamaya çalışmak, tekrar okumaktan iyidir', 'Bilgiyi geri çağırmaya çalışmak ve tekrarları günlere yaymak, öğrenme biliminin en sağlam iki bulgusudur. Günün Kelimeleri bu yüzden ertesi gün de soruluyor.', 'Roediger ve Karpicke, 2006; Cepeda ve ark., 2006', 'https://pubmed.ncbi.nlm.nih.gov/16719566/'],
  ['Algı hızı', 'Algı hızı antrenmanı, uzun vadeli etkisi en çok araştırılan egzersizlerdendir. Çalışma yaşlılarda yapılmıştır; Göz Ucu bu fikirden esinlenir.', 'ACTIVE çalışması, Edwards ve ark., 2017', 'https://www.sciencedaily.com/releases/2017/11/171116104955.htm'],
  ['Mola gerçekten iyi gelir', 'Kısa molalar enerjiyi artırıp yorgunluğu azaltıyor. Kısa nefes/farkındalık çalışmaları dikkati destekleyebiliyor.', 'Albulescu ve ark., 2022; Zeidan ve ark., 2010', 'https://www.sciencedaily.com/releases/2022/08/220831152754.htm'],
  ['Bir gün kaçırmak dert değil', 'Alışkanlık ortalama 2 ay sürer ve tek bir boş gün onu bozmaz. Serinde haftada 1 boş gün bu yüzden affediliyor.', 'Lally ve ark., 2010', 'https://www.ucl.ac.uk/news/2009/aug/how-long-does-it-take-form-habit'],
  ['Beyne iyi gelen 3 şey ekranın dışında', 'Hareket (merdiveni kullan, kısa yürüyüş), iyi uyku (öğrendiklerini kalıcı yapar) ve yeni, zorlayıcı bir şey öğrenmek.', 'Chang ve ark., 2012; Rasch ve Born, 2013; Park ve ark., 2014', 'https://pmc.ncbi.nlm.nih.gov/articles/3768102'],
];
function bilimPage() {
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="gt">Bilim ne diyor?</span></div>
  <div class="bilimlist">${BILIM.map(([t, p, k, u]) => `
    <div class="card"><b>${t}</b><p>${p}</p><a href="${u}" target="_blank" rel="noopener">${k} ↗</a></div>`).join('')}
    <p class="foot">Zihin Molası bir oyundur; tıbbi bir tedavi ya da teşhis aracı değildir.</p>
  </div>`);
  $('#x').onclick = backHome;
}

/* ---------- Günün Kelimeleri ---------- */
const WORD_COLOR = '#5C8A3A';
function recentWords() {
  const s = new Set();
  for (let i = 0; i < 3; i++) { const d = new Date(); d.setDate(d.getDate() - i); const r = S.words[dayKey(d)]; if (r) r.w.forEach(w => s.add(w)); }
  return s;
}

function startDaily(dg) {
  const ctx = { daily: dg, i: 0, k: dayKey() }; // mola başladığı günün anahtarı (gece yarısını geçse de)
  if (dailyDone()) return playGame(dg[0], ctx); // bugünkü mola bitti; "bir tur daha" yalnız oyun
  const y = ZM.pendingRecall(S.words, new Date());
  if (y) return recallScreen(y, 'next', ctx, () => studyWords(ctx));
  studyWords(ctx);
}

function studyWords(ctx) {
  const k = ctx.k;
  if (S.words[k]) return playGame(ctx.daily[0], ctx); // bugün zaten çalışıldı
  const w = ZM.pickWords(ZM.KELIMELER, 6, Math.random, recentWords());
  S.words[k] = { w }; save();
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="progress">Günün Molası · Kelimeler</span></div>
  <div class="tbar"><i id="tb"></i></div>
  <div class="howto" style="gap:18px">
    <h2>Günün Kelimeleri</h2>
    <p>Bu 6 kelimeyi aklında tut. İpucu: hepsini <b>tek bir saçma hikâyede</b> birleştir. Molanın sonunda soracağız, yarın da bir daha!</p>
    <div class="wgrid">${w.map(x => `<div class="wcard">${x}</div>`).join('')}</div>
  </div>
  <button class="btn" id="ready">Hazırım</button>`);
  $('#x').onclick = backHome;
  const tb = $('#tb');
  const t = makeTimer(20000, l => { tb.style.transform = `scaleX(${l / 20000})`; }, () => playGame(ctx.daily[0], ctx));
  cleanup = () => t.stop();
  $('#ready').onclick = () => playGame(ctx.daily[0], ctx);
}

function recallScreen(k, mode, ctx, next) {
  const targets = S.words[k].w;
  const others = ZM.pickWords(ZM.KELIMELER, 6, Math.random, new Set([...recentWords(), ...targets]));
  const tiles = shuffle([...targets, ...others]);
  const title = mode === 'next' ? 'Dünün Kelimeleri' : 'Kelimeler geri dönüyor!';
  const sub = mode === 'next' ? 'Dün aklında tuttuğun 6 kelime vardı. Bakalım bir gece uykudan sonra neler kalmış?' : 'Molanın başında gördüğün 6 kelimeyi seç.';
  go(`
  <div class="gtop"><button class="close" id="x" aria-label="Çık">✕</button><span class="progress">Günün Molası · Hatırlama</span><span class="gs" id="cnt">0/6</span></div>
  <div class="howto" style="gap:14px">
    <h2>${title}</h2>
    <p>${sub}</p>
    <div class="wgrid pick">${tiles.map(x => `<button class="wcard" data-w="${x}">${x}</button>`).join('')}</div>
    <p class="fb" id="rmsg"></p>
  </div>
  <button class="btn" id="check">Kontrol et</button>`);
  $('#x').onclick = backHome;
  const chosen = new Set(), cnt = $('#cnt'), msg = $('#rmsg');
  let checked = false;
  $('.wgrid', app).addEventListener('click', e => {
    const b = e.target.closest('.wcard'); if (!b || checked) return;
    const w = b.dataset.w;
    if (chosen.has(w)) { chosen.delete(w); b.classList.remove('sel'); }
    else if (chosen.size >= 6) { msg.textContent = 'En fazla 6 kelime seçebilirsin'; msg.className = 'fb bad'; return; }
    else { chosen.add(w); b.classList.add('sel'); beep(520, .04); }
    msg.textContent = ''; cnt.textContent = `${chosen.size}/6`;
  });
  $('#check').onclick = () => {
    if (checked) return next();
    checked = true;
    const sc = ZM.recallScore([...chosen], targets);
    S.words[k][mode] = sc;
    if (mode === 'now') S.hist.push({ g: 'kelime', s: sc, d: dayKey(), t: Date.now() });
    save();
    app.querySelectorAll('.wgrid .wcard').forEach(b => {
      const w = b.dataset.w, t = targets.includes(w), c = chosen.has(w);
      b.classList.add(t && c ? 'hit' : c ? 'fa' : t ? 'miss' : 'dim');
    });
    msg.className = 'fb ' + (sc >= 4 ? 'ok' : 'bad');
    msg.innerHTML = (sc === 6 ? '6/6! Hafızan bugün jilet gibi.' : sc >= 4 ? `${sc}/6, çok iyi.` : `${sc}/6. Hikâye kurmayı dene, fark edeceksin.`) +
      '<br><small style="color:var(--soft);font-weight:500">yeşil: doğru · kırmızı: yanlış seçim · sarı: kaçan</small>';
    $('#check').textContent = 'Devam';
    if (sc >= 4) buzz([30, 40, 30]);
  };
}

renderHome();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
